<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuración de Lapsos | Liceo Nacional</title>
    <link rel="stylesheet" href="/src/styles/global.css" />
    <!-- CSS Nativo Puro para este módulo -->
    <link rel="stylesheet" href="/src/styles/lapsos.css" />
    <!-- Iconos de Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      body {
        animation: startPage 0.8s;
      }
    </style>
    <link rel="stylesheet" href="/src/styles/layout.css" />
  <script src="/src/scripts/layout.js" defer></script>
</head>
  <body>
    <header id="navbar-container" class="navbar-wrapper"></header>
    <div class="layout-main">
      <aside id="sidebar-container" class="sidebar-wrapper"></aside>
      <main class="content-wrapper main">

    <main class="lapsos-main">
      <!-- Tarjeta Principal de Configuración -->
      <div class="config-card">
        <div class="config-card__header">
          <div class="config-card__icon-box">
            <i data-lucide="settings" class="config-card__icon"></i>
          </div>
          <div>
            <h2 class="config-card__title">
              Definir Fechas de los Lapsos Académicos
            </h2>
            <p class="config-card__description">
              Establece cuándo inicia y termina cada lapso. Esto afectará el
              registro de asistencias y notas.
            </p>
          </div>
        </div>

        <form id="lapsosForm" class="config-card__body">
          <!-- 1er Lapso -->
          <div class="form-row form-row--bordered">
            <div class="form-row__label-group">
              <span class="form-row__badge">1</span>
              Primer Lapso
            </div>
            <div class="form-group">
              <label class="form-group__label">Fecha de Inicio</label>
              <input type="date" id="inicio1" required class="form-group__input" />
            </div>
            <div class="form-group">
              <label class="form-group__label">Fecha de Cierre</label>
              <input type="date" id="fin1" required class="form-group__input" />
            </div>
          </div>

          <!-- 2do Lapso -->
          <div class="form-row form-row--bordered">
            <div class="form-row__label-group">
              <span class="form-row__badge">2</span>
              Segundo Lapso
            </div>
            <div class="form-group">
              <label class="form-group__label">Fecha de Inicio</label>
              <input type="date" id="inicio2" required class="form-group__input" />
            </div>
            <div class="form-group">
              <label class="form-group__label">Fecha de Cierre</label>
              <input type="date" id="fin2" required class="form-group__input" />
            </div>
          </div>

          <!-- 3er Lapso -->
          <div class="form-row">
            <div class="form-row__label-group">
              <span class="form-row__badge">3</span>
              Tercer Lapso
            </div>
            <div class="form-group">
              <label class="form-group__label">Fecha de Inicio</label>
              <input type="date" id="inicio3" required class="form-group__input" />
            </div>
            <div class="form-group">
              <label class="form-group__label">Fecha de Cierre</label>
              <input type="date" id="fin3" required class="form-group__input" />
            </div>
          </div>

          <!-- Alerta de Error (Oculta por defecto) -->
          <div id="errorAlert" class="alert alert--error hidden">
            <i data-lucide="alert-circle" class="alert__icon"></i>
            <span id="errorMessage"></span>
          </div>

          <!-- Alerta de Éxito (Oculta por defecto) -->
          <div id="successAlert" class="alert alert--success hidden">
            <i data-lucide="check-circle-2" class="alert__icon"></i>
            <span>¡Fechas de los lapsos guardadas exitosamente en la base de datos!</span>
          </div>

          <!-- Botón Guardar / Editar -->
          <div class="form-actions">
            <button type="submit" id="btnAction" class="btn btn--submit">
              <!-- El contenido será rellenado dinámicamente con JS -->
            </button>
          </div>
        </form>
      </div>
    </main>

    <!-- Modal de Carga (Oculto) -->
    <div id="loadingModal" class="modal-overlay hidden">
      <div class="modal-content">
        <i data-lucide="loader-2" class="modal-content__spinner"></i>
        <p class="modal-content__text">
          Sincronizando con el servidor...
        </p>
      </div>
    </div>

      </main>
    </div>
    <!-- Importamos la configuración global para tener la URL del API (igual que en subjectsmanager) -->
    <script src="/src/scripts/config.js"></script>
    <script>
      // Inicializar iconos de Lucide
      lucide.createIcons();

      const form = document.getElementById("lapsosForm");
      const errorAlert = document.getElementById("errorAlert");
      const errorMessage = document.getElementById("errorMessage");
      const successAlert = document.getElementById("successAlert");
      const loadingModal = document.getElementById("loadingModal");
      const btnAction = document.getElementById("btnAction");

      let isEditing = true; // Variable para controlar el estado del formulario

      // Función para cambiar entre modo Lectura (false) y Edición (true)
      function setEditMode(enable) {
        isEditing = enable;
        
        // Bloquea o desbloquea los inputs
        const inputs = document.querySelectorAll('input[type="date"]');
        inputs.forEach(input => input.disabled = !enable);

        if (enable) {
          btnAction.innerHTML = '<i data-lucide="save" class="btn__icon"></i> Guardar Configuración';
          btnAction.className = "btn btn--submit btn--submit-save";
        } else {
          btnAction.innerHTML = '<i data-lucide="edit" class="btn__icon"></i> Editar fechas de lapsos';
          btnAction.className = "btn btn--submit btn--submit-edit";
        }
        
        // Renderizar los nuevos iconos inyectados
        lucide.createIcons();
      }

      // Por defecto arranca en modo edición, en caso de no cargar datos
      setEditMode(true);

      // Función para obtener el token (igual que en subjectsmanager)
      const token = localStorage.getItem("auth");
      const apiUrl = window.APP_CONFIG
        ? window.APP_CONFIG.api_url
        : "http://127.0.0.1:5000"; // Ajustar si es necesario

      // === CONEXIÓN REAL: OBTENER LOS LAPSOS AL ABRIR LA PÁGINA ===
      window.addEventListener("DOMContentLoaded", async () => {
        try {
          // Hacemos una petición GET al backend para traer los lapsos existentes
          const response = await fetch(`${apiUrl}/lapsos/current`, {
            method: "GET",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
          });

          if (response.ok) {
            const data = await response.json();
            document.getElementById("inicio1").value = data.lapsos[0].fecha_inicio;
            document.getElementById("fin1").value = data.lapsos[0].fecha_fin;
            document.getElementById("inicio2").value = data.lapsos[1].fecha_inicio;
            document.getElementById("fin2").value = data.lapsos[1].fecha_fin;
            document.getElementById("inicio3").value = data.lapsos[2].fecha_inicio;
            document.getElementById("fin3").value = data.lapsos[2].fecha_fin;
            
            // Como sí hay datos en base de datos, lo pasamos a modo de lectura
            setEditMode(false);
          } else {
            // Valores por defecto si la base de datos está vacía
            document.getElementById("inicio1").value = "2025-10-01";
            document.getElementById("fin1").value = "2025-12-15";
            setEditMode(true);
          }
        } catch (error) {
          console.warn("No se pudo conectar al servidor para obtener las fechas. Mostrando datos por defecto.");
          setEditMode(true);
        }
      });

      // === CONEXIÓN REAL: GUARDAR LOS LAPSOS EN EL BACKEND ===
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        errorAlert.classList.add("hidden");
        successAlert.classList.add("hidden");

        // Si el usuario presionó el botón pero estamos en "Modo Lectura", activamos la "Edición"
        if (!isEditing) {
          setEditMode(true);
          return; // Detenemos la ejecución aquí, no se enviará nada a la base de datos aún
        }

        const lapsos = [
          {
            lapso: 1,
            inicio: new Date(document.getElementById("inicio1").value),
            fin: new Date(document.getElementById("fin1").value),
          },
          {
            lapso: 2,
            inicio: new Date(document.getElementById("inicio2").value),
            fin: new Date(document.getElementById("fin2").value),
          },
          {
            lapso: 3,
            inicio: new Date(document.getElementById("inicio3").value),
            fin: new Date(document.getElementById("fin3").value),
          },
        ];

        // Validaciones
        for (let i = 0; i < lapsos.length; i++) {
          if (lapsos[i].fin <= lapsos[i].inicio) {
            showError(`En el ${i + 1}° Lapso, la fecha de cierre debe ser posterior a la fecha de inicio.`);
            return;
          }
          if (i > 0) {
            if (lapsos[i].inicio <= lapsos[i - 1].fin) {
              showError(`El ${i + 1}° Lapso no puede iniciar antes de que termine el ${i}° Lapso.`);
              return;
            }
          }
        }

        loadingModal.classList.remove("hidden");

        const payload = {
          lapsos: [
            {
              lapso: 1,
              fecha_inicio: document.getElementById("inicio1").value,
              fecha_fin: document.getElementById("fin1").value,
            },
            {
              lapso: 2,
              fecha_inicio: document.getElementById("inicio2").value,
              fecha_fin: document.getElementById("fin2").value,
            },
            {
              lapso: 3,
              fecha_inicio: document.getElementById("inicio3").value,
              fecha_fin: document.getElementById("fin3").value,
            },
          ],
          año_escolar: "2025-2026",
        };

        try {
          // Petición POST real al backend
          const response = await fetch(`${apiUrl}/lapsos/create`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify(payload),
          });

          if (response.ok || response.status === 201) {
            loadingModal.classList.add("hidden");
            successAlert.classList.remove("hidden");
            // Al guardar exitosamente, lo devolvemos a modo lectura
            setEditMode(false);
          } else {
            const errorData = await response.json();
            throw new Error(errorData.message || "Error al guardar en el servidor");
          }
        } catch (error) {
          loadingModal.classList.add("hidden");
          showError("Ocurrió un error conectando con el backend: " + error.message);
        }
      });

      function showError(msg) {
        errorMessage.textContent = msg;
        errorAlert.classList.remove("hidden");
      }

      document.getElementById("btnBack").addEventListener("click", (e) => {
        e.preventDefault();
        document.body.style.animation = "goodByePage .8s forwards";

        setTimeout(
          () => (window.location.href = "/app/admin/dashboard/"),
          1000,
        );
      });
    </script>
    </div>
</body>
</html>
