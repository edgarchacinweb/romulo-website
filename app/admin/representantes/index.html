<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Representantes</title>
    <!-- Estilos -->
    <link rel="stylesheet" href="/src/styles/global.css" />
    <link rel="stylesheet" href="/src/styles/parentsmanager.css" />

    <!-- Estilo adicional para el grupo de cédula -->
    <style>
      .cedula-group {
        display: flex;
        gap: 10px;
      }
      .cedula-type {
        width: 70px;
        padding: 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        background-color: #fff;
      }
    </style>

    <!-- Configuración -->
    <script src="/src/scripts/config.js" type="module"></script>

    <!-- Componentes -->
    <script
      src="/src/components/notifications-container.component.js"
      type="module"
      defer
    ></script>
    <script
      src="/src/components/notification.component.js"
      type="module"
      defer
    ></script>
    <script
      src="/src/components/loader.component.js"
      type="module"
      defer
    ></script>
  </head>
  <body>
    <notifications-container id="notifications"></notifications-container>
    <div class="app-container">
      <header class="main-header">
        <div>
          <h1>Gestión de Representantes</h1>
          <p>Administra los representantes de la institución educativa</p>
        </div>
        <a href="/app/admin/dashboard/" class="btn-outline">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Salir
        </a>
      </header>

      <div class="dashboard-layout">
        <aside class="form-panel">
          <div class="card">
            <div class="card-header">
              <h2>Agregar Representante</h2>
              <p>Completa los datos del nuevo representante</p>
            </div>

            <form id="repForm">
              <div class="form-group">
                <label for="nombre">Nombre</label>
                <input
                  type="text"
                  id="nombre"
                  placeholder="Ej: Juan"
                  required
                />
              </div>

              <div class="form-group">
                <label for="apellido">Apellido</label>
                <input
                  type="text"
                  id="apellido"
                  placeholder="Ej: Pérez"
                  required
                />
              </div>

              <!-- CAMBIO AQUÍ: Selector de Tipo de Cédula -->
              <div class="form-group">
                <label for="cedula">Cédula de Identidad</label>
                <div class="cedula-group">
                  <select id="tipo-cedula" class="cedula-type">
                    <option value="V">V</option>
                    <option value="E">E</option>
                  </select>
                  <input
                    type="text"
                    id="cedula"
                    placeholder="Ej: 12345678"
                    required
                  />
                </div>
              </div>

              <div class="form-group">
                <label for="sexo">Género</label>
                <select class="form-select" id="sexo">
                  <option value="Masculino">Masculino</option>
                  <option value="Femenino">Femenino</option>
                </select>
              </div>

              <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input
                  type="email"
                  id="email"
                  placeholder="Ej: ejemplo@gmail.com"
                  required
                />
              </div>

              <button type="submit" class="btn-primary" id="btn-submit">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Registrar Representante
              </button>
            </form>
          </div>
        </aside>

        <main class="list-panel">
          <div class="card list-container">
            <div class="card-header">
              <h2>Representantes Activos</h2>
              <p>Total registrados: <span id="totalCount">...</span></p>
            </div>

            <div id="repsList" class="reps-grid"></div>
          </div>
        </main>
      </div>
    </div>

    <script src="/src/scripts/parentsmanager.js" type="module"></script>
  </body>
</html>
