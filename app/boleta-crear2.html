<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Boletas - Administración</title>
    
    <style>
        /* --- ESTILOS CSS --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
        }
        
        /* BARRA DE NAVEGACIÓN SUPERIOR */
        .navbar {
            background-color: #1A75E0;
            color: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between; 
        }

        .navbar-left {
            display: flex;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
            padding: 15px 0;
            font-size: 1.5em;
            color: white;
            flex-shrink: 0;
        }

        #navMenu {
            display: flex;
            margin-left: 20px;
        }

        .nav-link {
            padding: 15px 20px;
            cursor: pointer;
            transition: background-color 0.3s;
            border-left: 1px solid rgba(255, 255, 255, 0.2);
        }

        .nav-link.active {
            background-color: #00458b;
            font-weight: bold;
        }
        
        /* BOTÓN DE SALIR (ARRIBA) */
        .btn-salir {
            padding: 10px 20px;
            background-color: #cc0000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s;
        }

        /* CONTENIDO PRINCIPAL */
        .main-content {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            min-height: calc(100vh - 60px);
        }

        .main-content h1 {
            color: #1A75E0;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        /* SECCIÓN DE BÚSQUEDA */
        .search-area {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
        }

        #cedulaInput {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
        }

        #btnBuscar {
            padding: 10px 25px;
            background-color: #1A75E0;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* TABLA DE NOTAS */
        .tabla-notas { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .tabla-notas th, .tabla-notas td { border: 1px solid #ddd; padding: 10px 8px; text-align: center; }
        .tabla-notas th { background-color: #f0f8ff; color: #333; font-weight: bold; }
        .nota-input { width: 50px; }
        .observacion-input { width: 90%; }
        .nota-final { background-color: #e6f7ff; font-weight: bold; color: #1A75E0; }

        /* BOTONES DE ACCIÓN INFERIORES (Ajustados) */
        .bottom-actions {
            margin-top: 30px;
            display: flex;
            justify-content: flex-end; /* Mueve todo a la derecha */
            align-items: flex-end; /* Asegura alineación vertical */
            gap: 15px; /* Espacio entre los botones */
        }
        
        /* Estilo para el botón de Guardar */
        .btn-guardar {
            padding: 12px 25px;
            background-color: #1A75E0;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
        }
        
        /* Estilo para el botón de Notificación (Más pequeño) */
        .btn-accion-global {
            padding: 8px 15px; /* Reducción de padding */
            background-color: #28a745; 
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95em; /* Reducción de fuente */
            transition: background-color 0.3s;
        }
        
    </style>
</head>
<body>
    
    <div class="navbar">
        <div class="navbar-left">
            <h2>Control de Boletas</h2>
            <div id="navMenu">
                </div>
        </div>
        
        <button class="btn-salir" onclick="simularSalida()">
            🚪 Salir
        </button>
    </div>

    <div class="main-content">
        <h1 id="tituloSeccion">Seleccione un Año y Sección para buscar estudiante</h1>
        
        <div id="busquedaContainer" style="display: none;">
             <div class="search-area">
                <label for="cedulaInput" id="cedulaLabel" style="font-weight: bold;">Cédula del Estudiante de [SECCIÓN]:</label>
                <input type="text" id="cedulaInput" placeholder="Ej: 15900000" required>
                <button id="btnBuscar">Cargar Boleta</button>
            </div>
        </div>

        <div id="infoEstudiante" style="margin-bottom: 20px;"></div>
        <div id="boletaNotas">
            <p>Seleccione un año/sección en el menú superior para comenzar.</p>
        </div>
        
        <div class="bottom-actions">
            <button class="btn-accion-global" onclick="enviarNotificacion()">
                📢 Enviar Notificación de Notas Listas
            </button>
            
            <button class="btn-guardar" onclick="guardarNotasAdmin()" style="display: none;" id="btnGuardar">
                ✅ Guardar Ediciones
            </button>
        </div>
    </div>

    <script>
        // --- DATOS SIMULADOS ---
        const secciones = [
            { 
                id: '1A', 
                nombre: '1er Año - Sección A', 
                estudiantes: [
                    { cedula: '20123456', nombre: 'Juan Pérez', materias: [{ id: 1, nombre: 'Biología', L1: 12, L2: 13, L3: 14, obs: '' }] },
                    { cedula: '20123457', nombre: 'Laura Díaz', materias: [{ id: 1, nombre: 'Biología', L1: 18, L2: 19, L3: 18, obs: '' }] }
                ]
            },
            { 
                id: '3U', 
                nombre: '3er Año - Sección Única', 
                estudiantes: [
                    { 
                        cedula: '15900000', 
                        nombre: 'María Zambrano', 
                        materias: [
                            { id: 101, nombre: 'Matemática', L1: 18, L2: 15, L3: 16, obs: 'Excelente desempeño.' },
                            { id: 103, nombre: 'Física', L1: 10, L2: 11, L3: 13, obs: 'Requiere tutoría.' }
                        ]
                    },
                    { 
                        cedula: '15900001', 
                        nombre: 'Carlos López', 
                        materias: [
                            { id: 101, nombre: 'Matemática', L1: 10, L2: 10, L3: 10, obs: 'Justo en el límite.' },
                            { id: 103, nombre: 'Física', L1: 15, L2: 16, L3: 17, obs: 'Muy buen progreso.' }
                        ]
                    }
                ]
            }
        ];

        let seccionActivaId = null;
        let estudianteActivo = null;

        // --- INICIALIZACIÓN Y EVENTOS ---

        document.addEventListener('DOMContentLoaded', () => {
            cargarMenu();
            document.getElementById('btnBuscar').addEventListener('click', buscarEstudiante);
        });

        // --- FUNCIONES CORE ---

        function simularSalida() {
            const confirmacion = confirm("¿Está seguro que desea cerrar la sesión de Control de Boletas?");
            if (confirmacion) {
                alert("Sesión cerrada. Redirigiendo a la página principal (simulación).");
                // En un sistema real, aquí se redirigiría al login: window.location.href = 'pagina-de-login.html';
            }
        }

        function cargarMenu() {
            const navMenu = document.getElementById('navMenu');
            secciones.forEach(seccion => {
                const link = document.createElement('div');
                link.className = 'nav-link';
                link.textContent = seccion.nombre;
                link.onclick = () => seleccionarSeccion(seccion.id, seccion.nombre, link);
                navMenu.appendChild(link);
            });
        }

        function seleccionarSeccion(id, nombre, clickedElement) {
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            clickedElement.classList.add('active');
            
            seccionActivaId = id;
            estudianteActivo = null;
            
            document.getElementById('busquedaContainer').style.display = 'flex';
            document.getElementById('cedulaLabel').textContent = `Cédula del Estudiante de ${nombre}:`;
            document.getElementById('tituloSeccion').textContent = `Búsqueda de Boleta en ${nombre}`;
            
            document.getElementById('infoEstudiante').innerHTML = '';
            document.getElementById('boletaNotas').innerHTML = '<p>Ingrese la cédula para cargar la boleta de notas.</p>';
            document.getElementById('btnGuardar').style.display = 'none';
            document.getElementById('cedulaInput').value = '';
            document.getElementById('cedulaInput').focus();
        }

        function buscarEstudiante() {
            const cedulaInput = document.getElementById('cedulaInput');
            const infoEstudianteDiv = document.getElementById('infoEstudiante');
            const boletaNotasDiv = document.getElementById('boletaNotas');
            
            if (!seccionActivaId) return;

            const cedulaBusqueda = cedulaInput.value.replace(/[^0-9]/g, '');
            if (!cedulaBusqueda) {
                boletaNotasDiv.innerHTML = '<p style="color: red;">Ingrese una cédula válida.</p>';
                return;
            }

            const seccion = secciones.find(s => s.id === seccionActivaId);
            const estudiante = seccion ? seccion.estudiantes.find(e => e.cedula === cedulaBusqueda) : null;

            if (estudiante) {
                estudianteActivo = estudiante;
                infoEstudianteDiv.innerHTML = `Estudiante: <strong>${estudiante.nombre}</strong> (C.I. ${estudiante.cedula})`;
                mostrarBoleta(estudiante);
            } else {
                estudianteActivo = null;
                infoEstudianteDiv.innerHTML = '';
                boletaNotasDiv.innerHTML = `<p style="color: red;">❌ El estudiante C.I. ${cedulaBusqueda} NO está registrado en ${seccion.nombre}.</p>`;
                document.getElementById('btnGuardar').style.display = 'none';
            }
        }

        function mostrarBoleta(estudiante) {
            const boletaNotasDiv = document.getElementById('boletaNotas');
            const btnGuardar = document.getElementById('btnGuardar');
            
            let tablaHTML = `<table class="tabla-notas" id="tablaNotas">
                                <thead>
                                    <tr>
                                        <th style="width: 25%;">Materia</th>
                                        <th style="width: 10%;">1er Lapso</th>
                                        <th style="width: 10%;">2do Lapso</th>
                                        <th style="width: 10%;">3er Lapso</th>
                                        <th style="width: 10%;">Nota Final</th>
                                        <th style="width: 35%;">Observación</th>
                                    </tr>
                                </thead>
                                <tbody>`;

            estudiante.materias.forEach(materia => {
                const idBase = `admin_${estudiante.cedula}_${materia.id}`; 
                const notaFinal = calcularFinal(materia.L1, materia.L2, materia.L3);
                
                tablaHTML += `<tr>
                                <td style="text-align: left; font-weight: bold;">${materia.nombre}</td>
                                <td><input type="number" min="0" max="20" class="nota-input" id="${idBase}_L1" value="${materia.L1}" oninput="actualizarFinalAdmin('${idBase}')"></td>
                                <td><input type="number" min="0" max="20" class="nota-input" id="${idBase}_L2" value="${materia.L2}" oninput="actualizarFinalAdmin('${idBase}')"></td>
                                <td><input type="number" min="0" max="20" class="nota-input" id="${idBase}_L3" value="${materia.L3}" oninput="actualizarFinalAdmin('${idBase}')"></td>
                                <td class="nota-final" id="${idBase}_Final" style="color: ${notaFinal < 10 ? '#cc0000' : '#1A75E0'};">${notaFinal.toFixed(1)}</td>
                                <td>
                                    <input type="text" class="observacion-input" id="${idBase}_Obs" value="${materia.obs}">
                                </td>
                              </tr>`;
            });

            tablaHTML += `</tbody></table>`;
            
            boletaNotasDiv.innerHTML = tablaHTML;
            btnGuardar.style.display = 'block';
        }
        
        function calcularFinal(n1, n2, n3) {
             const promedio = (n1 + n2 + n3) / 3;
             return Math.round(promedio * 10) / 10;
        }

        function actualizarFinalAdmin(idBase) {
            const nota1 = parseFloat(document.getElementById(`${idBase}_L1`).value) || 0;
            const nota2 = parseFloat(document.getElementById(`${idBase}_L2`).value) || 0;
            const nota3 = parseFloat(document.getElementById(`${idBase}_L3`).value) || 0;
            const celdaFinal = document.getElementById(`${idBase}_Final`);

            const notaRedondeada = calcularFinal(nota1, nota2, nota3);
            
            celdaFinal.textContent = notaRedondeada.toFixed(1);
            celdaFinal.style.color = notaRedondeada < 10 ? '#cc0000' : '#1A75E0';
        }

        function guardarNotasAdmin() {
            if (!estudianteActivo) return;
            
            const confirmacion = confirm(`¿Está seguro de GUARDAR las ediciones para el estudiante ${estudianteActivo.nombre}?`);
            
            if (confirmacion) {
                console.log(`Guardando cambios para: ${estudianteActivo.nombre}`);
                alert("✅ Ediciones de notas guardadas con éxito. (Simulación)");
            }
        }
        
        function enviarNotificacion() {
             const mensaje = "La carga y verificación de notas ha finalizado. ¿Desea enviar una notificación masiva (ej: a representantes) informando que las notas están **LISTAS PARA CONSULTA**?";
             const confirmacion = confirm(mensaje);
             
             if (confirmacion) {
                 console.log("Se enviará notificación masiva.");
                 alert("📢 Notificación de notas listas enviada con éxito. (Simulación)");
             } else {
                 alert("Envío de notificación masiva cancelado.");
             }
        }
    </script>
</body>
</html>
