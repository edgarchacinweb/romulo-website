<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión | Liceo Nacional</title>

    <link rel="stylesheet" href="../src/styles/reset.css" />
    <link rel="stylesheet" href="../src/styles/global.css" />

    <script src="../src/components/notification.component.js" type="module"></script>
    <script src="../src/components/loader.component.js" type="module"></script>
    <script src="../src/scripts/config.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* 🎯 Evita el scroll vertical */
            background-color: #f0f4f8;
        }

        /* FONDO CON LA IMAGEN ROMO.PNG */
        .background-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('../src/assets/images/romo.png') no-repeat center center;
            background-size: cover;
            filter: blur(8px); /* Difuminado suave */
            z-index: -1;
            transform: scale(1.1);
        }

        .login-container {
            width: 90%;
            max-width: 700px; /* 🎯 Diseño horizontal */
            z-index: 10;
        }

        .login-box {
            background: white;
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .logo-header {
            width: 110px; /* Tamaño reducido para ahorrar espacio */
            height: auto;
            margin: 0 auto 15px auto;
            display: block;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
        }

        /* FILA PARA USUARIO Y CONTRASEÑA LADO A LADO */
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            flex: 1;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        .login-button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .login-button:hover {
            background-color: #0056b3;
        }

        .forgot-password {
            display: block;
            margin-top: 15px;
            color: #007bff;
            text-decoration: none;
            font-size: 13px;
        }

        .notifications {
            position: fixed;
            top: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="background-overlay"></div>
    <div id="loader"></div>
    <section class="notifications"></section>

    <div class="login-container">
        <div class="login-box">
            <img src="../src/assets/images/Liceo.png" alt="Logo" class="logo-header" />
            <h2>Iniciar Sesión</h2>

            <form id="loginForm">
                <div class="form-row">
                    <div class="input-group">
                        <label for="username">Usuario:</label>
                        <input type="text" id="username" placeholder="Ingrese usuario" />
                    </div>
                    <div class="input-group">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" placeholder="••••••••" />
                    </div>
                </div>

                <button class="login-button" id="loginBtn">Entrar al Sistema</button>
            </form>
            
            <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
        </div>
    </div>

    <script>
        // Lógica de autenticación se mantiene igual para no romper el sistema
        const role = localStorage.getItem("role");
        if (role) {
            window.location.href = role === "administrador" ? "/app/dashboard/" : "/app/horario_ver.html";
        }

        document.getElementById("loginBtn").addEventListener("click", (e) => {
            e.preventDefault();
            // ... resto de tu lógica de fetch ...
            console.log("Intentando entrar...");
        });
    </script>
</body>
</html>
