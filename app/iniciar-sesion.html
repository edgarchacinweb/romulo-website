<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academia Integral - Iniciar Sesión</title>
    <link rel="stylesheet" href="/src/styles/global.css" />
    <link rel="stylesheet" href="/src/styles/login.css" />

    <script src="/src/components/loader.component.js" type="module"></script>
    <script
      src="/src/components/notifications-container.component.js"
      type="module"
    ></script>
    <script
      src="/src/components/notification.component.js"
      type="module"
    ></script>
  </head>
  <body>
    <notifications-container id="notifications"></notifications-container>
    <main class="login-container">
      <div class="background-glow"></div>

      <section class="login-card">
        <div class="login-header">
          <div class="logo-container">
            <img src="/src/assets/images/romulo.webp" class="logo-img" />
          </div>
          <h1>Inicar Sesión</h1>
          <p>Liceo Nacional "Don Rómulo Gallegos"</p>
        </div>

        <form id="loginForm" class="login-form">
          <div class="input-group">
            <label for="email">Correo Electrónico</label>
            <div class="input-wrapper">
              <span class="icon">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                </svg>
              </span>
              <input
                type="email"
                id="username"
                placeholder="tu@correo.com"
                required
                autocomplete="off"
              />
            </div>
          </div>

          <div class="input-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
              <span class="icon">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect
                    x="3"
                    y="11"
                    width="18"
                    height="11"
                    rx="2"
                    ry="2"
                  ></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input
                type="password"
                id="password"
                placeholder="........"
                required
              />
              <button
                type="button"
                id="togglePassword"
                class="toggle-visibility"
                aria-label="Mostrar contraseña"
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" id="loginBtn" class="btn-primary">
            <span class="btn-text">Iniciar Sesión</span>
            <span class="btn-loader"></span> <span class="btn-icon">→</span>
          </button>

          <div class="form-footer">
            <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
          </div>
        </form>

        <footer class="card-footer">
          <p>
            © 2026 Liceo Nacional "Don Rómulo Gallegos". <br />Todos los
            derechos reservados.
          </p>
        </footer>
      </section>
    </main>

    <script src="/src/scripts/config.js"></script>
    <script src="/src/scripts/login.js"></script>
  </body>
</html>
