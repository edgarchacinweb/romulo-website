<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Liceo Don Rómulo Gallegos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body, html { 
            height: 100%; 
            width: 100%; 
            background: transparent; 
            color: white;
            overflow: hidden; 
        }

        .full-background {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('../../src/assets/images/romu.png') no-repeat center center;
            background-size: cover;
            filter: blur(15px) brightness(0.8);
            transform: scale(1.1);
            z-index: -1;
        }

        header { padding: 20px 50px; }
        .logo-nav { height: 60px; }

        .scroll-wrapper {
            height: calc(100vh - 100px);
            overflow-y: auto;
            padding: 20px 5%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .content-area { width: 100%; max-width: 1200px; text-align: center; }

        /* AZUL COBALTO RESALTADO */
        h1 { 
            color: #4d8aff; 
            font-size: 3.5rem; 
            margin-bottom: 10px; 
            font-weight: 800;
            text-shadow: 0 0 15px rgba(77, 138, 255, 0.7);
        }

        .intro {
            font-size: 1.4rem;
            margin-bottom: 50px;
            color: #ffffff;
        }

        /* FILA HORIZONTAL DE LOGOS */
        .contact-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: nowrap; /* Mantiene todo en una línea */
            margin-bottom: 50px;
        }

        .contact-card {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(77, 138, 255, 0.4);
            border-radius: 20px;
            padding: 25px 15px;
            width: 250px;
            transition: 0.4s ease;
            text-decoration: none;
            color: white;
            backdrop-filter: blur(5px);
        }

        .contact-card:hover {
            border-color: #4d8aff;
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(77, 138, 255, 0.4);
            background: rgba(77, 138, 255, 0.1);
        }

        .contact-card i {
            font-size: 3rem;
            color: #4d8aff;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 8px rgba(77, 138, 255, 0.8));
        }

        .contact-card h3 {
            font-size: 1.3rem;
            color: #4d8aff;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(77, 138, 255, 0.5);
        }

        .contact-card p {
            font-size: 0.95rem;
            opacity: 0.9;
            word-wrap: break-word;
        }

        .btn-regresar {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 15px 40px;
            background: #4d8aff;
            color: #001a33;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(77, 138, 255, 0.4);
        }

        .btn-regresar:hover {
            background: #ffffff;
            color: #4d8aff;
            transform: scale(1.05);
        }

        /* Responsive para pantallas pequeñas */
        @media (max-width: 1000px) {
            .contact-row { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <div class="full-background"></div>

    <header>
        <img src="../../src/assets/images/romulo.png" alt="Logo" class="logo-nav">
    </header>

    <div class="scroll-wrapper">
        <main class="content-area">
            <h1>Canales de Atención</h1>
            <p class="intro">Estamos a tu disposición para cualquier consulta académica o administrativa.</p>
            
            <div class="contact-row">
                <div class="contact-card">
                    <i class="fas fa-phone-alt"></i>
                    <h3>Teléfono</h3>
                    <p>+58 412-4953176</p>
                </div>

                <div class="contact-card">
                    <i class="fas fa-envelope"></i>
                    <h3>Correo</h3>
                    <p>liceoromulogallegos@gmail.com</p>
                </div>

                <a href="#" class="contact-card">
                    <i class="fab fa-instagram"></i>
                    <h3>Instagram</h3>
                    <p>@liceo_romulogallegos</p>
                </a>

                <a href="#" class="contact-card">
                    <i class="fab fa-facebook-f"></i>
                    <h3>Facebook</h3>
                    <p>Liceo Rómulo Gallegos</p>
                </a>
            </div>
            
            <a href="index.html" class="btn-regresar">
                <i class="fas fa-arrow-left"></i> Regresar al Inicio
            </a>
        </main>
    </div>

</body>
</html>
