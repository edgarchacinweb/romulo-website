<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liceo Don Rómulo Gallegos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        }
        
        body, html { 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            background-color: #000;
        }

        .hero-section {
            background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.4)), 
                        url('../../src/assets/images/romu.png'); 
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 12px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .logo-nav { 
            height: 45px; 
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.2));
            transition: transform 0.3s;
        }
        .logo-nav:hover { transform: scale(1.05); }

        .nav-links { 
            display: flex; 
            list-style: none; 
            gap: 30px; 
        }
        
        .nav-links a { 
            color: rgba(255, 255, 255, 0.9); 
            text-decoration: none; 
            font-size: 14px; 
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .nav-links a:hover { 
            color: #4d8aff; 
            transform: translateY(-2px);
            text-shadow: 0 0 10px rgba(77, 138, 255, 0.6);
        }

        .auth-btns { display: flex; gap: 15px; }
        
        .btn { 
            border: 1.5px solid rgba(77, 138, 255, 0.5); 
            color: white; 
            padding: 10px 22px; 
            border-radius: 12px; 
            text-decoration: none; 
            font-weight: 600;
            font-size: 14px;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-primary:hover { 
            background: #4d8aff; 
            color: #000; 
            box-shadow: 0 0 20px rgba(77, 138, 255, 0.5);
            border-color: #4d8aff;
        }

        .main-container { flex: 1; }

    </style>
</head>
<body>

    <div class="hero-section">
        <header>
            <a href="index.html">
                <img src="../../src/assets/images/romulo.png" alt="Logo" class="logo-nav">
            </a>
            
            <nav>
                <ul class="nav-links">
                    <li><a href="sobre-nosotros.html"><i class="fas fa-info-circle"></i> Sobre nosotros</a></li>
                    <li><a href="oferta-academica.html"><i class="fas fa-graduation-cap"></i> Oferta académica</a></li>
                    <li><a href="galeria.html"><i class="fas fa-images"></i> Galería</a></li>
                    <li><a href="contacto.html"><i class="fas fa-envelope"></i> Contacto</a></li>
                </ul>
            </nav>

            <div class="auth-btns">
                <a href="../inscripcion-selector.html" class="btn btn-primary">
                    <i class="fas fa-user-plus"></i> Inscribirse
                </a>
                <a href="#" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </a>
            </div>
        </header>

        <main class="main-container"></main>
    </div>

</body>
</html>
