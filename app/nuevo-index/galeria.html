<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería - Liceo Don Rómulo Gallegos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body, html { 
            height: 100%; 
            width: 100%; 
            background: transparent; 
            color: white;
            overflow: hidden; 
        }

        /* FONDO DIFUMINADO */
        .full-background {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('../../src/assets/images/romu.png') no-repeat center center;
            background-size: cover;
            filter: blur(15px) brightness(0.85);
            transform: scale(1.1);
            z-index: -1;
        }

        header {
            padding: 20px 50px;
            background: transparent;
        }

        .logo-nav { height: 60px; }

        .scroll-wrapper {
            height: calc(100vh - 100px);
            overflow-y: auto;
            padding: 20px 5%;
        }

        .content-area {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        h1 { 
            color: #82aaff; 
            font-size: 3.2rem; 
            margin-bottom: 40px; 
            font-weight: 800;
            text-shadow: 0 0 12px rgba(130, 170, 255, 0.6), 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* DISEÑO DE LA CUADRÍCULA DE IMÁGENES */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            border: 2px solid rgba(130, 170, 255, 0.3);
            aspect-ratio: 4 / 3;
            transition: 0.4s ease;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s ease;
        }

        .gallery-item:hover {
            border-color: #82aaff;
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(130, 170, 255, 0.5);
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        /* BOTÓN DE REGRESO CON GLOW */
        .btn-regresar {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin: 40px 0;
            padding: 15px 45px;
            background: #82aaff;
            color: #001a33;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s ease;
            box-shadow: 0 5px 20px rgba(130, 170, 255, 0.4);
        }

        .btn-regresar:hover {
            background: #ffffff;
            color: #82aaff;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.3);
        }

        /* Scrollbar personalizado */
        .scroll-wrapper::-webkit-scrollbar { width: 8px; }
        .scroll-wrapper::-webkit-scrollbar-thumb { background: #82aaff; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="full-background"></div>

    <header>
        <img src="../../src/assets/images/romulo.png" alt="Logo" class="logo-nav">
    </header>

    <div class="scroll-wrapper">
        <main class="content-area">
            <h1>Galería de Momentos</h1>
            
            <div class="gallery-grid">
                <div class="gallery-item"><img src="../../src/assets/images/Nueva carpeta/descarga (1).jpg" alt="Imagen 1"></div>
                <div class="gallery-item"><img src="../../src/assets/images/Nueva carpeta/descarga (2).jpg" alt="Imagen 2"></div>
                <div class="gallery-item"><img src="../../src/assets/images/Nueva carpeta/descarga.jpg" alt="Imagen 3"></div>
                <div class="gallery-item"><img src="../../src/assets/images/Nueva carpeta/images (1).jpg" alt="Imagen 4"></div>
                <div class="gallery-item"><img src="../../src/assets/images/Nueva carpeta/images (2).jpg" alt="Imagen 5"></div>
                <div class="gallery-item"><img src="../../src/assets/images/Nueva carpeta/images (3).jpg" alt="Imagen 6"></div>
                <div class="gallery-item"><img src="../../src/assets/images/Nueva carpeta/images (4).jpg" alt="Imagen 7"></div>
                <div class="gallery-item"><img src="../../src/assets/images/Nueva carpeta/images.jpg" alt="Imagen 8"></div>
                <div class="gallery-item"><img src="../../src/assets/images/Nueva carpeta/WhatsApp Image 2026-01-29 at 4.01.46 PM.jpeg" alt="Imagen 9"></div>
                <div class="gallery-item"><img src="../../src/assets/images/Nueva carpeta/WhatsApp Image 2026-01-29 at 4.01.47 PM (1).jpeg" alt="Imagen 10"></div>
                <div class="gallery-item"><img src="../../src/assets/images/Nueva carpeta/WhatsApp Image 2026-01-29 at 4.01.47 PM (3).jpeg" alt="Imagen 11"></div>
                <div class="gallery-item"><img src="../../src/assets/images/Nueva carpeta/WhatsApp Image 2026-01-29 at 4.01.47 PM (4).jpeg" alt="Imagen 12"></div>
                <div class="gallery-item"><img src="../../src/assets/images/Nueva carpeta/WhatsApp Image 2026-01-29 at 4.01.47 PM (5).jpeg" alt="Imagen 13"></div>
                <div class="gallery-item"><img src="../../src/assets/images/Nueva carpeta/WhatsApp Image 2026-01-29 at 4.01.47 PM.jpeg" alt="Imagen 14"></div>
                <div class="gallery-item"><img src="../../src/assets/images/Nueva carpeta/WhatsApp Image 2026-01-29 at 4.01.48 PM (1).jpeg" alt="Imagen 15"></div>
                <div class="gallery-item"><img src="../../src/assets/images/Nueva carpeta/WhatsApp Image 2026-01-29 at 4.01.48 PM.jpeg" alt="Imagen 16"></div>
            </div>
            
            <a href="index.html" class="btn-regresar">
                <i class="fas fa-arrow-left"></i> Regresar al Inicio
            </a>
        </main>
    </div>

</body>
</html>
