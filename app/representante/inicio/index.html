<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio - Representante</title>

    <!-- Estilos -->
    <link rel="stylesheet" href="/src/styles/global.css" />
    <link rel="stylesheet" href="/src/styles/parentsdashboard.css" />

    <!-- Estilos específicos para unificar con el diseño del Admin -->
    <style>
      .sidebar {
        width: 260px !important;
        background-color: #ffffff !important; 
        border-right: 1px solid #e0e0e0 !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
        height: 100vh !important;
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        padding: 0 !important;
        box-shadow: none !important; 
        z-index: 100 !important;
      }

      .sidebar > div:first-child {
        padding: 20px !important;
      }

      .sidebar .logo {
        display: flex !important;
        align-items: center !important;
        gap: 15px !important;
        padding-bottom: 20px !important;
        border-bottom: 1px solid #eee !important;
        margin-bottom: 20px !important;
      }

      .sidebar .logo img {
        width: 45px !important;
        height: auto !important;
      }

      .sidebar .logo h2 {
        font-size: 16px !important;
        color: #003366 !important; 
        margin: 0 !important;
        line-height: 1.3 !important;
        font-weight: 700 !important;
      }

      .sidebar ul {
        list-style: none !important;
        padding: 0 !important;
        margin: 0 !important;
        display: flex !important;
        flex-direction: column !important;
        gap: 12px !important;
      }

      .sidebar ul li a {
        text-decoration: none !important;
        color: #333 !important;
        font-size: 15px !important;
        display: flex !important;
        align-items: center !important;
        gap: 10px !important;
        padding: 10px 12px !important;
        border-radius: 6px !important;
        transition: background 0.2s, color 0.2s !important;
      }

      .sidebar ul li a:hover {
        background-color: #f0f4f8 !important;
        color: #003366 !important;
      }

      .sidebar .user {
        padding: 20px !important;
        border-top: 1px solid #eee !important;
        background-color: #ffffff !important;
      }

      .sidebar .user-info strong {
        display: block !important;
        color: #333 !important;
        font-size: 14px !important;
      }
      
      .sidebar .user-info span {
        color: #666 !important;
        font-size: 12px !important;
      }

      .main-content {
        margin-left: 260px !important;
        width: calc(100% - 260px) !important;
      }
    </style>

    <script src="/src/scripts/config.js"></script>
    <script src="/src/components/loader.component.js" type="module" defer></script>
    <script src="/src/components/notification.component.js" type="module" defer></script>
    <script src="/src/components/notifications-container.component.js" type="module" defer></script>
  </head>
  <body>
    <notifications-container id="notifications"></notifications-container>
    
    <aside class="sidebar">
      <div>
        <div class="logo">
          <img src="/src/assets/images/romulo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/45'" />
          <h2>Liceo Romulo<br>Gallegos</h2>
        </div>
        <ul>
          <li><a href="/app/representante/inscripcion/">📋 Inscribir a Estudiante</a></li>
          <li><a href="/app/representante/boletas/">📝 Boletas</a></li>
          <li><a href="/app/representante/horarios/">📅 Horarios</a></li>
          <li><a href="/app/representante/editar-perfil/">👤 Editar Perfil</a></li>
          <li style="margin-top: 15px;">
            <a href="#" id="logout">➜] Salir</a>
          </li>
        </ul>
      </div>
      <div class="user">
        <div class="user-info">
          <!-- ID FUNDAMENTAL: Aquí se inyecta el nombre -->
          <strong id="sidebar-user-name">Cargando...</strong>
          <span>Representante</span>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <div class="content-wrapper">
        <div class="page-header">
          <!-- ID FUNDAMENTAL: Aquí se inyecta el saludo -->
          <h1 id="welcome-name">Mis Estudiantes</h1>
          <p>Gestiona la Información académica de tus representados</p>
        </div>

        <section class="card__container" id="card-container"></section>
      </div>
    </main>

    <script src="/src/scripts/parentsdashboard.js" type="module"></script>
  </body>
</html>
