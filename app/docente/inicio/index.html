<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Docente</title>
    
    <!-- Estilos -->
    <link rel="stylesheet" href="/src/styles/global.css" />
    <!-- Usamos el CSS del admin para unificar diseño -->
    <link rel="stylesheet" href="/src/styles/dashboard.css" />
  </head>
  <body>
    <!-- Barra lateral con el diseño del Admin -->
    <aside class="sidebar">
      <div>
        <div class="logo">
          <img src="/src/assets/images/romulo.png" alt="Logo" onerror="this.style.display='none'" />
          <h2>Liceo Romulo Gallegos</h2>
        </div>
        <ul>
          <li><a href="/app/docente/horarios/">📅 Visualizar Horario</a></li>
          <li><a href="/app/docente/calificaciones/">📝 Calificaciones</a></li>
          <li><a href="../asistencia/index.html">✅ Asistencias</a></li>
          <!-- Enlace de Cerrar Sesión en la Sidebar -->
          <li style="margin-top: 15px;">
            <a href="#" id="sidebar-logout">➜] Salir</a>
          </li>
        </ul>
      </div>
      <div class="user">
        <div class="user-info">
          <!-- ID aquí para el nombre en la barra lateral -->
          <strong id="sidebar-user-name">Cargando...</strong>
          <span>Panel de Gestión</span>
        </div>
      </div>
    </aside>

    <!-- Contenido Principal con el diseño del Admin -->
    <main class="main">
      <header>
        <h1>Sistema de Gestión Docente</h1>
      </header>

      <section class="welcome" style="display: flex; align-items: center; gap: 20px;">
        <div class="welcome-icon" style="background-color: #2563eb; padding: 15px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
            <path d="M6 12v5c3 3 9 3 12 0v-5" />
          </svg>
        </div>
        <div>
          <!-- ID aquí para el título de bienvenida -->
          <h2 id="welcome-name">Bienvenido(a)</h2>
          <p style="color: #666; margin-top: 5px;">Accede a las herramientas de gestión educativa desde este panel centralizado</p>
        </div>
      </section>

      <!-- SECCIÓN DE TARJETAS ELIMINADA -->
      
    </main>

    <script src="/src/scripts/config.js" type="module"></script>
    <script src="/src/scripts/teacherdashboard.js" type="module"></script>
  </body>
</html>
