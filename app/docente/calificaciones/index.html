<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carga de Calificaciones - Instituto Educativo San Miguel</title>

    <!-- Estilos CSS -->
    <link rel="stylesheet" href="/src/styles/global.css" />
    <link rel="stylesheet" href="/src/styles/teachercalificationmanager.css" />
  </head>
  <body>
    <div id="app-container" class="page-enter">
      <header class="navbar">
        <div class="brand">
          <div class="logo-container">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="#1a56db"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
          </div>
          <div class="brand-text">
            <h1>Instituto Educativo San Miguel</h1>
            <p>Carga de Calificaciones</p>
          </div>
        </div>
        <button id="btn-volver" class="btn-outline">
          <svg
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Volver al Dashboard
        </button>
      </header>

      <main class="main-content">
        <section class="card params-card">
          <h2>Seleccione los Parámetros de Búsqueda</h2>
          <div class="params-grid">
            <div class="form-group">
              <label>Grado Académico</label>
              <div class="select-wrapper">
                <select id="select-grado" class="custom-select">
                  <option value="" disabled selected>
                    Seleccionar grado...
                  </option>
                  <option value="1">1ro de Secundaria</option>
                  <option value="2">2do de Secundaria</option>
                  <option value="3">3ro de Secundaria</option>
                  <option value="4">4to de Secundaria</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Sección</label>
              <div class="select-wrapper">
                <select id="select-seccion" class="custom-select" disabled>
                  <option value="" disabled selected>
                    Seleccionar sección...
                  </option>
                  <option value="A">Sección A</option>
                  <option value="B">Sección B</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Materia</label>
              <div class="select-wrapper">
                <select id="select-materia" class="custom-select" disabled>
                  <option value="" disabled selected>
                    Seleccionar materia...
                  </option>
                  <option value="matematicas">Matemáticas</option>
                  <option value="fisica">Física</option>
                  <option value="programacion">Programación</option>
                </select>
              </div>
            </div>
          </div>
        </section>

        <section id="dynamic-area" class="dynamic-area fade-transition">
          <div id="state-initial" class="state-container active">
            <div class="icon-circle">
              <svg
                viewBox="0 0 24 24"
                width="32"
                height="32"
                fill="none"
                stroke="#64748b"
                stroke-width="2"
              >
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <polyline points="19 12 12 19 5 12"></polyline>
              </svg>
            </div>
            <h3>Seleccione los parámetros de búsqueda</h3>
            <p>
              Escoja el grado, sección y materia para cargar la lista de
              estudiantes
            </p>
          </div>
        </section>
      </main>
    </div>

    <script src="/src/scripts/config.js"></script>
    <script
      src="/src/scripts/teachercalificationmanager.js"
      type="module"
    ></script>
  </body>
</html>
