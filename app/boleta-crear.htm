<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga de Notas | Liceo Nacional</title>
    <style>
        /* Estilos Base y Salir */
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding-top: 50px; color: #333; }
        .top-bar { position: absolute; top: 20px; right: 20px; }
        .exit-button { background-color: #007bff; color: #fff; border: none; padding: 8px 15px; border-radius: 5px; font-size: 14px; cursor: pointer; transition: background-color 0.3s ease; text-decoration: none; font-weight: 600; }
        .exit-button:hover { background-color: #0056b3; }

        /* Contenedor Principal y Encabezado */
        .main-content {
            width: 100%;
            max-width: 1200px;
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }
        
        /* --- AJUSTES DE LOGO Y ENCABEZADO PARA CENTRADO --- */
        .header-area { 
            display: flex; /* Usamos flexbox para alinear logo y título */
            align-items: center; 
            justify-content: center;
            margin-bottom: 25px; 
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 2px solid #007bff;
        }
        .logo { 
            max-width: 90px; 
            height: auto; 
            margin-right: 25px; /* Separación del logo al texto */
            margin-left: -50px; /* Desplaza el logo un poco más a la izquierda del centro */
        }
        .header-text {
            text-align: left;
        }
        .header-text h1 {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            margin: 0 0 5px 0;
        }
        .header-text p { 
            font-size: 14px; 
            color: #777; 
            margin: 0; 
            white-space: nowrap; /* Evita que la descripción se rompa */
        }
        /* ------------------------------------------------ */

        /* CONTROLES DE BÚSQUEDA */
        .search-controls {
            display: grid;
            grid-template-columns: 2fr 1fr; 
            gap: 20px;
            padding: 15px;
            background-color: #f0f8ff;
            border-radius: 5px;
            margin-bottom: 25px;
            border: 1px solid #d0e8ff;
            align-items: center; 
            max-width: 600px; /* Limitar el ancho del área de búsqueda */
            margin: 0 auto 25px auto; /* Centrar el área de búsqueda */
        }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #34495e; font-size: 14px; }
        .form-group input { 
            width: 100%; 
            max-width: 350px; /* Se ajusta el máximo, aunque el grid lo controla */
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-size: 16px; 
        }
        .search-button-group { grid-column: span 1; align-self: end; }
        .search-button {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
            max-width: 150px; /* Limitar el ancho del botón */
        }
        .search-button:hover { background-color: #0056b3; }

        /* Detalles del Estudiante y Tabla */
        #studentDetailsContainer {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
            background-color: #fff;
        }
        .details-header { text-align: left; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .details-header h2 { font-size: 20px; color: #2c3e50; margin: 0; }
        .details-header p { margin: 5px 0 0 0; font-size: 14px; }
        .student-name-ci { color: #007bff; font-weight: bold; }

        /* Tabla de Matriz de Notas */
        .notes-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .notes-table th, .notes-table td {
            border: 1px solid #ddd;
            padding: 8px 5px;
            text-align: center;
            font-size: 13px;
        }
        .notes-table th {
            background-color: #007bff;
            color: #fff;
            font-weight: bold;
        }
        .notes-table .subject-col { 
            text-align: left; 
            font-weight: 600; 
            background-color: #f8f8f8;
            width: 35%;
        }
        
        .notes-table input[type="number"] {
            width: 95%; 
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
            text-align: center;
            box-sizing: border-box;
            font-size: 14px;
        }
        .notes-table .note-display {
            font-weight: bold;
            color: #333;
        }
        
        /* Botón Final Guardar */
        .save-notes-button {
            background-color: #27ae60;
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            margin-top: 25px;
            transition: background-color 0.3s ease;
            font-weight: bold;
        }
        .save-notes-button:hover { background-color: #2ecc71; }
        
        /* Ocultar inicialmente */
        #studentDetailsContainer { display: none; }

    </style>
</head>
<body>
    
    <div class="top-bar">
        <a href="#" id="exitBtn" class="exit-button">Salir</a>
    </div>

    <div class="main-content">
        
        <div class="header-area">
            <img src="../src/assets/images/romulo.png" alt="Logo Liceo Nacional" class="logo">
            <div class="header-text">
                <h1>Carga y Gestión de Boletas de Notas</h1>
                <p>Busque al estudiante por **Cédula de Identidad (C.I.)** para ingresar o actualizar sus notas.</p>
            </div>
        </div>
        
        <div class="search-controls">
            <div class="form-group">
                <label for="ci_search">Cédula (C.I.):</label>
                <input type="text" id="ci_search" placeholder="Ej: V-XX.XXX.XXX" required>
            </div>
            
            <div class="search-button-group">
                <button type="button" id="searchStudentBtn" class="search-button">
                    Buscar Notas
                </button>
            </div>
        </div>
        <div id="studentDetailsContainer">
            <div class="details-header">
                <h2>Carga de Notas para <span id="studentFullName" class="student-name-ci">[Nombre del Estudiante]</span></h2>
                <p>
                    **C.I.:** <span id="studentCI" class="student-name-ci"></span> | **Curso:** <span id="studentCourse"></span>
                </p>
            </div>

            <form id="notesForm">
                
                <table class="notes-table">
                    <thead>
                        <tr>
                            <th class="subject-col">Asignatura</th>
                            <th>1er Lapso</th>
                            <th>2do Lapso</th>
                            <th>Nota Final</th>
                        </tr>
                    </thead>
                    <tbody id="notesTableBody">
                        </tbody>
                </table>
                
                <button type="submit" class="save-notes-button">Guardar TODAS las Notas Ingresadas</button>
            </form>
        </div>
        
    </div>

    <script>
        // Definición de las asignaturas según el grado (Se mantiene esta lógica)
        const ASSIGNMENTS_1_2 = [
            'Castellano', 'Inglés', 'Matemática', 'Grupo Estable', 
            'Arte y Patrimonio', 'Biología', 'Educación Física', 'Orientación y Convivencia'
        ];
        const ASSIGNMENTS_3_5 = [
            'Castellano', 'Inglés', 'Matemática', 'Grupo Estable', 
            'Biología', 'Educación Física', 'Orientación y Convivencia',
            'Química', 'Física'
        ];

        function getAssignments(grade) {
            const g = parseInt(grade);
            if (g === 1 || g === 2) {
                return ASSIGNMENTS_1_2;
            } else if (g >= 3 && g <= 5) {
                return ASSIGNMENTS_3_5;
            }
            return [];
        }

        // --- SIMULACIÓN: Función que obtendría los datos del estudiante del Backend por Cédula ---
        function getStudentDataByCI(ci) {
            
            if (!ci) return null;

            // Simulación de datos fijos con la CI de la imagen
            const simulatedData = {
                '31209909': { 
                    fullName: 'Javier Pérez Gómez',
                    grade: '2', 
                    section: 'D',
                    grades: {
                        'Castellano': { '1er Lapso': 19, '2do Lapso': 17, 'Final': 0 },
                        'Inglés': { '1er Lapso': 0, '2do Lapso': 0, 'Final': 0 },
                        'Matemática': { '1er Lapso': 15, '2do Lapso': 18, 'Final': 0 },
                        'Grupo Estable': { '1er Lapso': 0, '2do Lapso': 0, 'Final': 0 }, 
                        'Arte y Patrimonio': { '1er Lapso': 0, '2do Lapso': 0, 'Final': 0 },
                        'Biología': { '1er Lapso': 0, '2do Lapso': 0, 'Final': 0 },
                        'Educación Física': { '1er Lapso': 0, '2do Lapso': 0, 'Final': 0 },
                        'Orientación y Convivencia': { '1er Lapso': 0, '2do Lapso': 0, 'Final': 0 }
                    }
                },
                'V-30123456': { // Otro ejemplo de CI
                    fullName: 'María Fernanda López',
                    grade: '3', 
                    section: 'B',
                    grades: {
                        'Castellano': { '1er Lapso': 18, '2do Lapso': 18, 'Final': 0 },
                        'Inglés': { '1er Lapso': 17, '2do Lapso': 15, 'Final': 0 },
                        'Matemática': { '1er Lapso': 19, '2do Lapso': 20, 'Final': 0 },
                        'Grupo Estable': { '1er Lapso': 0, '2do Lapso': 0, 'Final': 0 }, 
                        'Biología': { '1er Lapso': 16, '2do Lapso': 0, 'Final': 0 },
                        'Educación Física': { '1er Lapso': 0, '2do Lapso': 0, 'Final': 0 },
                        'Orientación y Convivencia': { '1er Lapso': 0, '2do Lapso': 0, 'Final': 0 },
                        'Química': { '1er Lapso': 0, '2do Lapso': 0, 'Final': 0 },
                        'Física': { '1er Lapso': 0, '2do Lapso': 0, 'Final': 0 }
                    }
                }
            };

            const studentKey = ci.replace(/[^0-9A-Za-z]/g, ''); 
            const data = simulatedData[ci] || simulatedData[studentKey]; 

            if (!data) return null;

            return {
                ...data,
                ci: ci,
                course: `${data.grade}° Año - Sección ${data.section}`,
                assignments: getAssignments(data.grade)
            };
        }
        // ------------------------------------------------------------------------------------


        function generateNoteCell(subject, lapso, currentNote) {
            const noteValue = currentNote > 0 ? currentNote : '';
            const displayValue = currentNote > 0 ? `<span class="note-display">${currentNote}</span>` : 'PENDIENTE';
            
            const inputName = `note_${subject.replace(/\s+/g, '_')}_${lapso}`;
            
            return `
                <td>
                    ${displayValue}
                    <input type="number" 
                            name="${inputName}" 
                            min="1" max="20" 
                            placeholder="${noteValue || '1-20'}"
                            value=""
                            data-lapso="${lapso}"
                            data-subject="${subject}">
                </td>
            `;
        }


        document.addEventListener('DOMContentLoaded', function() {
            const exitBtn = document.getElementById('exitBtn');
            const searchStudentBtn = document.getElementById('searchStudentBtn');
            const studentDetailsContainer = document.getElementById('studentDetailsContainer');
            const notesTableBody = document.getElementById('notesTableBody');
            const notesForm = document.getElementById('notesForm');
            const ciSearchInput = document.getElementById('ci_search');

            const studentFullName = document.getElementById('studentFullName');
            const studentCI = document.getElementById('studentCI');
            const studentCourse = document.getElementById('studentCourse');
            
            
            exitBtn.addEventListener('click', function(event) {
                event.preventDefault(); 
                const confirmExit = confirm('¿Está seguro que desea salir? Los cambios sin guardar se perderán.');
                if (confirmExit) {
                    alert('Saliendo de la Interfaz de Carga de Notas.');
                }
            });
            
            searchStudentBtn.addEventListener('click', function() {
                const ci_search = ciSearchInput.value.trim();

                if (!ci_search) {
                    alert('⚠️ Por favor, ingrese la Cédula (C.I.) del estudiante.');
                    return;
                }

                const studentData = getStudentDataByCI(ci_search);

                if (!studentData) {
                    alert(`❌ Estudiante con Cédula ${ci_search} no encontrado.`);
                    studentDetailsContainer.style.display = 'none';
                    return;
                }
                
                const { fullName, ci, course, grades, assignments } = studentData;

                studentFullName.textContent = fullName;
                studentCI.textContent = ci;
                studentCourse.textContent = course;

                notesTableBody.innerHTML = '';
                const lapsos = ['1er Lapso', '2do Lapso', 'Final'];

                assignments.forEach(subject => {
                    const row = notesTableBody.insertRow();
                    row.insertCell().innerHTML = subject; 
                    row.cells[0].classList.add('subject-col');

                    lapsos.forEach(lapso => {
                        const currentNote = (grades[subject] && grades[subject][lapso]) || 0;
                        row.innerHTML += generateNoteCell(subject, lapso, currentNote);
                    });
                });

                studentDetailsContainer.style.display = 'block';
                alert(`✅ Boleta de notas de ${fullName} cargada para ${course}.`);
            });
            
            notesForm.addEventListener('submit', function(event) {
                event.preventDefault();
                
                const studentId = 12345; 
                const notesToSave = [];
                const noteInputs = notesForm.querySelectorAll('input[type="number"]');

                noteInputs.forEach(input => {
                    if (input.value && input.value >= 1 && input.value <= 20) {
                        notesToSave.push({
                            student_id: studentId,
                            lapso: input.getAttribute('data-lapso'),
                            subject: input.getAttribute('data-subject'),
                            note: input.value
                        });
                    }
                });
                
                if (notesToSave.length === 0) {
                    alert('No se ingresó ninguna nota válida para guardar.');
                    return;
                }

                console.log('Notas a guardar/actualizar:', notesToSave);
                alert(`¡Éxito! ${notesToSave.length} notas guardadas/actualizadas para ${studentFullName.textContent}. (Backend action required)`);
            });
        });
    </script>
</body>
</html>
