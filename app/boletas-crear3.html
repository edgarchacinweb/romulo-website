<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Boletas | Control de Estudios</title>
    <style>
        /* --- ESTILOS GENERALES Y LAYOUT --- */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
            margin: 0; 
            padding-top: 20px; 
            color: #333; 
        }
        .top-bar { 
            position: fixed; 
            top: 0; 
            left: 0; 
            right: 0; 
            background-color: #008CBA; /* Azul fuerte para Control */
            color: white; 
            padding: 10px 30px; 
            display: flex; 
            justify-content: flex-end; 
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2); 
            z-index: 1000;
        }
        .exit-button { 
            background-color: #cc0000; 
            color: #fff; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 5px; 
            font-size: 14px; 
            cursor: pointer; 
            transition: background-color 0.3s ease; 
            text-decoration: none; 
            font-weight: 600; 
        }
        .exit-button:hover { background-color: #990000; }

        .main-content { 
            width: 100%; 
            max-width: 1200px; 
            background-color: #fff; 
            padding: 30px; 
            margin-top: 60px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); 
            box-sizing: border-box; 
            position: relative; 
        } 

        .header-area { 
            text-align: center; 
            margin-bottom: 25px; 
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }
        .header-area h1 { 
            font-size: 28px; 
            font-weight: bold; 
            color: #008CBA; 
            margin: 0; 
        }
        .header-area p { font-size: 14px; color: #777; margin: 5px 0 0 0; }
        
        /* Controles de Filtro */
        .filter-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            padding: 15px;
            background-color: #e6f7ff; 
            border-radius: 5px;
            margin-bottom: 25px;
            border: 1px solid #cceeff;
        }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #34495e; font-size: 14px; }
        .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .load-button-group { align-self: end; grid-column: span 1; }
        .load-button { background-color: #008CBA; color: #fff; border: none; padding: 10px; border-radius: 4px; font-size: 16px; cursor: pointer; width: 100%; transition: background-color 0.3s ease; }
        .load-button:hover { background-color: #006b9a; }

        /* Lista de Estudiantes Cargados */
        #studentsListContainer {
            display: none;
            margin-top: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            background-color: #f9f9f9;
        }
        .student-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 8px;
            background-color: #fff;
            border: 1px solid #eee;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .student-item:hover {
            background-color: #f0f8ff;
            border-color: #008CBA;
        }
        .student-name-ci {
            font-weight: 600;
            color: #008CBA;
        }
        .student-name-ci span {
            font-size: 0.9em;
            color: #777;
            margin-left: 10px;
        }
        .status-tag {
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 0.8em;
            font-weight: bold;
            color: white;
            background-color: #ccc;
        }
        .status-tag.regular { background-color: #2ecc71; } 
        .status-tag.pendiente { background-color: #f39c12; } 

        /* Área de Notas Desplegable */
        .notes-area {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
            padding: 0 15px;
            background-color: #eaf6ff;
            border-left: 3px solid #008CBA;
            margin-bottom: 10px;
        }
        .notes-area.active {
            max-height: 800px; /* Incrementado para más contenido */
            padding: 15px;
        }

        .notes-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .notes-table th, .notes-table td {
            border: 1px solid #cceeff;
            padding: 8px;
            text-align: center;
            font-size: 14px;
        }
        .notes-table th {
            background-color: #008CBA;
            color: white;
        }
        .note-input {
            width: 50px;
            padding: 5px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .final-grade {
            font-weight: bold;
            color: #0056b3;
            background-color: #d0e8ff;
            text-align: center;
        }
        .final-grade.reprobado {
            color: #cc0000;
            background-color: #ffcccc;
        }
        .save-notes-btn {
            background-color: #27ae60;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 15px;
            margin-bottom: 5px;
            transition: background-color 0.3s ease;
            width: 100%;
        }
        .save-notes-btn:hover {
            background-color: #2ecc71;
        }
    </style>
</head>
<body>
    
    <div class="top-bar">
        <a href="#" id="exitBtn" class="exit-button">🚪 Salir</a>
    </div>

    <div class="main-content">
        
        <div class="header-area">
            <h1>📊 Gestión de Boletas y Calificaciones</h1>
            <p>Control de Estudios: Seleccione el año y la sección para listar a los estudiantes y gestionar sus notas por materia.</p>
        </div>
        
        <div class="filter-controls">
            <div class="form-group">
                <label for="grade">Año:</label>
                <select id="grade" required>
                    <option value="">Seleccione Año</option>
                    <option value="1">1er Año</option>
                    <option value="2" selected>2do Año</option>
                    <option value="3">3er Año</option>
                    <option value="4">4to Año</option>
                    <option value="5">5to Año</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="section">Sección:</label>
                <select id="section" required>
                    <option value="">Sección</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option> 
                    <option value="D" selected>D</option> 
                    <option value="E">E</option> 
                </select>
            </div>

            <div class="form-group">
                <label for="lapso">Lapso/Trimestre:</label>
                <select id="lapso" required>
                    <option value="1" selected>Primer Lapso</option>
                    <option value="2">Segundo Lapso</option>
                    <option value="3">Tercer Lapso</option>
                </select>
            </div>

            <div class="load-button-group">
                <button type="button" id="loadStudentsBtn" class="load-button">
                    Cargar Estudiantes
                </button>
            </div>
        </div>
        
        <div id="studentsListContainer">
            <h2 style="font-size: 20px; color: #2c3e50;">Lista de Estudiantes: <span id="current-class-display"></span></h2>
            <div id="studentItemsWrapper">
                </div>
        </div>

    </div>

    <script>
        // ================================================================
        // DATOS DE SIMULACIÓN
        // ================================================================
        const NUM_LAPSOS = 3;
        const NOTA_APROBATORIA = 10; // Nota mínima para aprobar

        // Simulación de la lista de estudiantes por sección
        const SIMULATED_CLASS_STUDENTS = {
            "2_D": [
                { id: 101, name: 'Ana García', ci: 'V-31.123.456', status: 'regular' },
                { id: 102, name: 'Carlos Rodríguez', ci: 'V-32.234.567', status: 'regular' },
                { id: 103, name: 'Elena Martínez', ci: 'V-33.345.678', status: 'pendiente' },
                { id: 104, name: 'Juan Pérez', ci: 'V-34.456.789', status: 'regular' },
                { id: 105, name: 'Lucía Fernández', ci: 'V-35.567.890', status: 'regular' },
            ],
        };

        // Simulación de las notas (Estructura: Notas[studentId][materia][lapso] = nota)
        const SIMULATED_GRADES = {
            101: { 
                "Matemática": { 1: 15, 2: 12, 3: 0, final: 0 },
                "Castellano": { 1: 18, 2: 18, 3: 0, final: 0 },
                "Inglés": { 1: 12, 2: 14, 3: 0, final: 0 },
                "Historia de Venezuela": { 1: 17, 2: 15, 3: 0, final: 0 },
                "Física": { 1: 14, 2: 10, 3: 0, final: 0 },
            },
            102: { 
                "Matemática": { 1: 10, 2: 11, 3: 0, final: 0 },
                "Castellano": { 1: 15, 2: 16, 3: 0, final: 0 },
                "Inglés": { 1: 8, 2: 15, 3: 0, final: 0 },
                "Historia de Venezuela": { 1: 12, 2: 14, 3: 0, final: 0 },
                "Física": { 1: 11, 2: 12, 3: 0, final: 0 },
            },
            103: {
                "Matemática": { 1: 8, 2: 9, 3: 0, final: 0 }, // Reprobando Lapso 1 y 2
                "Castellano": { 1: 19, 2: 17, 3: 0, final: 0 },
                "Inglés": { 1: 11, 2: 10, 3: 0, final: 0 },
                "Historia de Venezuela": { 1: 15, 2: 13, 3: 0, final: 0 },
                "Física": { 1: 10, 2: 11, 3: 0, final: 0 },
            }
            // Los demás estudiantes se inicializan al cargar si es necesario
        };
        
        // Función auxiliar para inicializar estudiantes sin datos
        function initializeStudentGrades(studentId) {
            if (!SIMULATED_GRADES[studentId]) {
                 SIMULATED_GRADES[studentId] = {
                    "Matemática": { 1: 0, 2: 0, 3: 0, final: 0 },
                    "Castellano": { 1: 0, 2: 0, 3: 0, final: 0 },
                    "Inglés": { 1: 0, 2: 0, 3: 0, final: 0 },
                    "Historia de Venezuela": { 1: 0, 2: 0, 3: 0, final: 0 },
                    "Física": { 1: 0, 2: 0, 3: 0, final: 0 },
                 };
            }
        }

        // ================================================================
        // FUNCIONES PRINCIPALES
        // ================================================================

        /**
         * Calcula el promedio final de una materia basándose en los lapsos registrados.
         */
        function calculateFinalGrade(gradesForSubject) {
            let sum = 0;
            let count = 0;
            for (let i = 1; i <= NUM_LAPSOS; i++) {
                const note = gradesForSubject[i];
                if (note !== undefined && note > 0) { // Solo contar lapsos registrados > 0
                    sum += note;
                    count++;
                }
            }
            
            if (count === 0) return 0;
            
            // Redondear al entero más cercano (típico en el sistema venezolano)
            return Math.round(sum / count);
        }

        // ... (resto de loadStudentsBtn y toggleNotes modificados abajo) ...

        /**
         * Despliega/contrae el área de notas del estudiante seleccionado.
         */
        window.toggleNotes = function(studentId, studentName) {
            const areaId = `notes_area_${studentId}`;
            const area = document.getElementById(areaId);
            const selectedLapso = document.getElementById('lapso').value;

            initializeStudentGrades(studentId); // Asegurar que el estudiante tenga estructura de notas
            const studentNotes = SIMULATED_GRADES[studentId]; 

            // 1. Contraer todas las demás áreas y remover la selección de items
            document.querySelectorAll('.notes-area.active').forEach(a => {
                if (a.id !== areaId) {
                    a.classList.remove('active');
                }
            });
            document.querySelectorAll('.student-item').forEach(i => i.style.backgroundColor = '#fff');
            
            // 2. Si ya estaba activa, solo la cerramos
            if (area.classList.contains('active')) {
                area.classList.remove('active');
            } else {
                // 3. Si no estaba activa, la abrimos y cargamos las notas
                area.classList.add('active');
                document.getElementById(`student_item_${studentId}`).style.backgroundColor = '#d0e8ff';

                let tableHtml = `
                    <h3 style="color: #006b9a; border-bottom: 1px dashed #cceeff; padding-bottom: 5px;">
                        Modificar Notas de ${studentName} (Lapso ${selectedLapso})
                    </h3>
                    <form id="form_notes_${studentId}" onsubmit="saveNotes(event, ${studentId}, '${studentName}')">
                        <table class="notes-table">
                            <thead>
                                <tr>
                                    <th>Materia</th>
                                    <th>Lapso 1</th>
                                    <th>Lapso 2</th>
                                    <th>Lapso 3</th>
                                    <th>Promedio (Nota Final)</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                // Recorrer las materias simuladas para el estudiante
                for (const subject in studentNotes) {
                    if (subject === 'final') continue; // Saltar el campo 'final' que no es una materia
                    
                    const noteL1 = studentNotes[subject][1] || 0;
                    const noteL2 = studentNotes[subject][2] || 0;
                    const noteL3 = studentNotes[subject][3] || 0;
                    
                    const finalGrade = studentNotes[subject].final;
                    const finalClass = finalGrade < NOTA_APROBATORIA && finalGrade > 0 ? 'final-grade reprobado' : 'final-grade';

                    // Determinar qué campo es editable (solo el lapso seleccionado)
                    let inputL1 = `<td style="${noteL1 < NOTA_APROBATORIA && noteL1 > 0 ? 'background-color: #ffe6e6;' : ''}">${noteL1}</td>`;
                    let inputL2 = `<td style="${noteL2 < NOTA_APROBATORIA && noteL2 > 0 ? 'background-color: #ffe6e6;' : ''}">${noteL2}</td>`;
                    let inputL3 = `<td style="${noteL3 < NOTA_APROBATORIA && noteL3 > 0 ? 'background-color: #ffe6e6;' : ''}">${noteL3}</td>`;
                    
                    const subjectKey = subject.replace(/\s/g, '_');
                    
                    if (selectedLapso == 1) inputL1 = `<td><input type="number" class="note-input" name="note_1_${subjectKey}" value="${noteL1}" min="0" max="20" required></td>`;
                    if (selectedLapso == 2) inputL2 = `<td><input type="number" class="note-input" name="note_2_${subjectKey}" value="${noteL2}" min="0" max="20" required></td>`;
                    if (selectedLapso == 3) inputL3 = `<td><input type="number" class="note-input" name="note_3_${subjectKey}" value="${noteL3}" min="0" max="20" required></td>`;
                    
                    // Fila de la tabla
                    tableHtml += `
                        <tr>
                            <td style="text-align: left; font-weight: 500;">${subject}</td>
                            ${inputL1}
                            ${inputL2}
                            ${inputL3}
                            <td class="${finalClass}">${finalGrade > 0 ? finalGrade : '--'}</td>
                        </tr>
                    `;
                }
                
                tableHtml += `
                            </tbody>
                        </table>
                        <button type="submit" class="save-notes-btn">💾 Guardar Notas de ${studentName} (Lapso ${selectedLapso})</button>
                    </form>
                `;
                
                area.innerHTML = tableHtml;
            }
        };

        /**
         * Simula el guardado de las notas modificadas y actualiza el promedio final.
         */
        window.saveNotes = function(event, studentId, studentName) {
            event.preventDefault();
            const form = document.getElementById(`form_notes_${studentId}`);
            const lapso = document.getElementById('lapso').value;
            const inputs = form.querySelectorAll('.note-input');
            let isError = false;

            // Asegurar que la estructura esté inicializada
            initializeStudentGrades(studentId);
            const studentGrades = SIMULATED_GRADES[studentId];

            inputs.forEach(input => {
                const parts = input.name.split('_');
                const lapsoKey = parts[1]; // 1, 2 o 3
                const subject = parts.slice(2).join(' ').replace(/_/g, ' '); // Reconstruir el nombre de la materia
                const note = parseInt(input.value);

                if (isNaN(note) || note < 0 || note > 20) {
                    alert(`🚨 Error: La nota de ${subject} debe ser entre 0 y 20.`);
                    input.focus();
                    isError = true;
                    return;
                }

                // 1. Simular la actualización del lapso específico en la base de datos
                if (studentGrades[subject]) {
                    studentGrades[subject][lapsoKey] = note;
                }
            });

            if (isError) return;

            // 2. Recalcular la nota final para todas las materias afectadas
            let reprobadasCount = 0;
            for (const subject in studentGrades) {
                if (subject !== 'final') {
                    const finalGrade = calculateFinalGrade(studentGrades[subject]);
                    studentGrades[subject].final = finalGrade;
                    
                    if (finalGrade > 0 && finalGrade < NOTA_APROBATORIA) {
                        reprobadasCount++;
                    }
                }
            }

            console.log(`Notas guardadas y finales calculadas para ${studentName}:`, studentGrades);
            alert(`✅ Notas de ${studentName} para el Lapso ${lapso} guardadas con éxito. ${reprobadasCount > 0 ? `(${reprobadasCount} materias con Nota Final Reprobada).` : ''} (Simulación)`);
            
            // Volver a cargar el despliegue para reflejar los cambios y la Nota Final
            toggleNotes(studentId, studentName); 
        };
        
        // ----------------------------------------------------
        // INICIALIZACIÓN Y CARGA DE ESTUDIANTES
        // ----------------------------------------------------
        
        document.getElementById('loadStudentsBtn').addEventListener('click', function() {
            const grade = document.getElementById('grade').value;
            const section = document.getElementById('section').value;
            const lapso = document.getElementById('lapso').value;

            if (!grade || !section) {
                alert('🚨 Por favor, seleccione un Año y una Sección.');
                return;
            }

            const classKey = `${grade}_${section}`;
            const students = SIMULATED_CLASS_STUDENTS[classKey] || [];
            
            document.getElementById('current-class-display').textContent = `${grade}° ${section} - Lapso ${lapso}`;
            const wrapper = document.getElementById('studentItemsWrapper');
            wrapper.innerHTML = '';
            
            if (students.length === 0) {
                wrapper.innerHTML = `<p style="text-align: center; color: #e74c3c;">⚠️ No se encontraron estudiantes para ${grade}° ${section}.</p>`;
            } else {
                students.forEach(student => {
                    // Inicializar estructura de notas (incluye el cálculo del promedio inicial)
                    initializeStudentGrades(student.id);
                    
                    const statusClass = student.status === 'pendiente' ? 'pendiente' : 'regular';
                    
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'student-item';
                    itemDiv.id = `student_item_${student.id}`;
                    itemDiv.onclick = () => toggleNotes(student.id, student.name);
                    
                    itemDiv.innerHTML = `
                        <div class="student-name-ci">
                            ${student.name} 
                            <span>(C.I. ${student.ci})</span>
                        </div>
                        <div class="status-tag ${statusClass}">
                            ${student.status.toUpperCase()}
                        </div>
                    `;
                    wrapper.appendChild(itemDiv);

                    // Insertar área de notas (inicialmente oculta)
                    const notesArea = document.createElement('div');
                    notesArea.className = 'notes-area';
                    notesArea.id = `notes_area_${student.id}`;
                    wrapper.appendChild(notesArea);
                });
            }

            document.getElementById('studentsListContainer').style.display = 'block';
        });

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('exitBtn').addEventListener('click', function(event) {
                event.preventDefault(); 
                alert("Sesión de Control de Estudios cerrada. (Simulación)");
            });
        });

    </script>
</body>
</html>
