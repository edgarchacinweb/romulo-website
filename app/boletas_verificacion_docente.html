<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Docente</title>
    
    <style>
        /* --- ESTILOS CSS PARA LA PÁGINA DE LOGIN --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-contenedor {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 350px;
        }

        .login-contenedor h1 {
            color: #1A75E0; /* Azul */
            margin-bottom: 25px;
            font-size: 1.8em;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .input-grupo {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-grupo label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .input-grupo input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1em;
        }

        .btn-acceder {
            width: 100%;
            padding: 12px;
            background-color: #1A75E0;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            transition: background-color 0.3s;
        }

        .btn-acceder:hover {
            background-color: #0056b3;
        }

        #mensaje-error {
            color: #cc0000;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    
    <div class="login-contenedor">
        <h1>Acceso Docente</h1>
        <p>Ingrese su Cédula de Identidad para acceder al sistema de notas.</p>

        <form id="loginForm">
            <div class="input-grupo">
                <label for="cedula">Cédula de Identidad:</label>
                <input type="text" id="cedula" name="cedula" required placeholder="V-12345678">
            </div>
            
            <button type="submit" class="btn-acceder">
                Acceder al Sistema
            </button>
            
            <div id="mensaje-error"></div>
        </form>
    </div>

    <script>
        // --- CÓDIGO JAVASCRIPT PARA LA VERIFICACIÓN ---
        
        // Cédulas VÁLIDAS simuladas:
        const CEDULAS_VALIDAS = ['12345678', '87654321', '10000000']; 
        
        const loginForm = document.getElementById('loginForm');
        const cedulaInput = document.getElementById('cedula');
        const mensajeError = document.getElementById('mensaje-error');

        loginForm.addEventListener('submit', function(event) {
            // Evitar que el formulario se envíe de forma tradicional
            event.preventDefault(); 
            
            // Limpiar el mensaje de error anterior
            mensajeError.textContent = '';

            // Obtener y limpiar la cédula (quitar V-, guiones, espacios, etc.)
            const cedulaIngresada = cedulaInput.value.toUpperCase().replace(/[^0-9]/g, '');

            if (CEDULAS_VALIDAS.includes(cedulaIngresada)) {
                // Éxito: Simular que la cédula es válida
                
                // En un sistema real, aquí se guardaría el ID del docente en una sesión.
                alert(`Bienvenido, docente con C.I. ${cedulaIngresada}. Redirigiendo...`);
                
                // REDIRECCIÓN: Cambia esta línea si tu archivo de interfaz tiene otro nombre
                window.location.href = 'interfaz_docente_v2.html'; 

            } else {
                // Fallo: Cédula no registrada o inválida
                mensajeError.textContent = '❌ Cédula no registrada o inválida. Verifique los datos.';
            }
        });

    </script>
</body>
</html>
