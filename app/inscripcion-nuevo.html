<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuevo Ingreso | Liceo Nacional</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/src/styles/global.css" />
    <link rel="stylesheet" href="/src/styles/register_new.css" />

    <!-- Components -->
    <script src="/src/components/loader.component.js" type="module"></script>
    <script
      src="/src/components/notification.component.js"
      type="module"
    ></script>
  </head>
  <body>
    <div class="main-container">
      <div class="header-area">
        <img
          src="../src/assets/images/romulo.png"
          alt="Logo Liceo Nacional"
          class="logo"
        />
        <h1>Inscripción: Primer Año (Nuevo Ingreso)</h1>
        <p>
          Complete todos los campos de datos y adjunte los documentos
          obligatorios.
        </p>
      </div>

      <form
        id="enrollmentForm"
        method="POST"
        action="tu_endpoint_nuevo_ingreso"
        enctype="multipart/form-data"
      >
        <div class="form-content">
          <div class="form-fields">
            <h2 class="section-title full-width">
              1. Datos del Estudiante y Representante
            </h2>

            <div class="input-group">
              <label for="student_name">Nombre Completo del Estudiante:</label>
              <input
                type="text"
                id="student_name"
                name="student_name"
                required
              />
            </div>

            <div class="input-group">
              <label for="student_name">C.I del Estudiante:</label>
              <input
                type="number"
                id="student_identity"
                name="student_identity"
                max="38000000"
                title="El número de cédula debe tener máximo 8 digitos"
                required
              />
            </div>

            <div class="input-group">
              <label for="rep_name">Nombre Completo del Representante:</label>
              <input type="text" id="rep_name" name="rep_name" required />
            </div>

            <div class="input-group">
              <label for="rep_phone">Teléfono del Representante:</label>
              <input type="tel" id="rep_phone" name="rep_phone" required />
            </div>

            <div class="input-group">
              <label for="rep_email"
                >Correo Electrónico del Representante:</label
              >
              <input type="email" id="rep_email" name="rep_email" required />
            </div>

            <div class="input-group">
              <label for="rep_ci"
                >Cédula de Identidad del Representante (C.I.):</label
              >
              <input
                type="number"
                id="rep_ci"
                name="rep_ci"
                max="38000000"
                required
              />
            </div>

            <div class="input-group full-width">
              <label for="address">Dirección de Habitación:</label>
              <textarea
                id="address"
                name="address"
                rows="2"
                required
              ></textarea>
            </div>

            <h2 class="section-title full-width" style="margin-top: 20px">
              2. Carga de Documentos Obligatorios
            </h2>

            <div class="input-group file-upload-group">
              <label for="foto_estudiante"
                >Foto del Estudiante (Tipo Carnet):</label
              >
              <input
                type="file"
                id="foto_estudiante"
                name="foto_estudiante"
                accept="image/*"
                required
              />
            </div>

            <div class="input-group file-upload-group">
              <label for="foto_representante"
                >Foto del Representante (Tipo Carnet):</label
              >
              <input
                type="file"
                id="foto_representante"
                name="foto_representante"
                accept="image/*"
                required
              />
            </div>

            <div class="input-group file-upload-group">
              <label for="foto_representante"
                >Documentación del Estudiante:</label
              >
              <input
                type="file"
                id="doc_estudiante"
                name="doc_estudiante"
                accept=".pdf,/*"
                required
              />
            </div>

            <div class="input-group file-upload-group">
              <label for="foto_representante"
                >Documentación del Representante:</label
              >
              <input
                type="file"
                id="doc_representante"
                name="doc_representante"
                accept=".pdf,/*"
                required
              />
            </div>

            <!-- <div class="input-group file-upload-group">

                required
              />
              <p>Solo archivo PDF o imagen.</p>
            </div>

            <div class="input-group file-upload-group">

              <input

                accept=".pdf,image/*"
                required
              />
              <p>Solo archivo PDF o imagen.</p>
            </div>

            <div class="input-group file-upload-group">

              <input
                type="file"
                id="copia_ci_rep"
                name="copia_ci_rep"
                accept=".pdf,image/*"
                required
              />
            </div>

            <div class="input-group file-upload-group">
              <label for="copia_ci_est">Copia C.I. del Estudiante:</label>
              <input
                type="file"
                id="copia_ci_est"
                name="copia_ci_est"
                accept=".pdf,image/*"
                required
              />
            </div> -->
          </div>
        </div>

        <button type="submit" class="submit-button">
          Registrar e Inscribir Alumno
        </button>
      </form>

      <a href="inscripcion-selector.html" class="back-link"
        >← Volver al Menú de Inscripción</a
      >
    </div>

    <script src="/src/scripts/register_new.js" type="module"></script>
  </body>
</html>
