<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Rol - Liceo Nacional "Don Rómulo Gallegos"</title>
    <link rel="stylesheet" href="/src/styles/global.css">
    <link rel="stylesheet" href="/src/styles/roleselector.css">
</head>

<body class="page-enter">
    <notifications-container id="notifications"></notifications-container>
    <header class="header">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
        </div>
        <h1>Liceo Nacional "Don Rómulo Gallegos"</h1>
        <h2>Selección de Rol de Usuario</h2>
        <div class="divider">
            <span>Selecciona tu rol</span>
        </div>
    </header>

    <main class="cards-container"></main>

    <footer class="footer-actions">
        <button id="btn-logout" class="btn-outline">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Cerrar sesión
        </button>
        <p class="copyright">Liceo Nacional "Don Rómulo Gallegos" • Derechos Reservados © 2026</p>
    </footer>

    <confirm-modal id="logout-modal"></confirm-modal>

    <script type="module" src="/src/scripts/config.js"></script>
    <script src="/src/components/RoleCard.component.js"></script>
    <script src="/src/components/ConfirmModal.component.js"></script>
    <script src="/src/components/loader.component.js"></script>
    <script src="/src/components/notification.component.js"></script>
    <script src="/src/components/notifications-container.component.js"></script>
    <script src="/src/scripts/roleselector.js"></script>
</body>

</html>
