<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Rol - Liceo Nacional "Don Rómulo Gallegos"</title>
    <link rel="stylesheet" href="/src/styles/global.css">
    <link rel="stylesheet" href="/src/styles/roleselector.css">
</head>

<body class="page-enter">
    <notifications-container id="notifications"></notifications-container>
    <header class="header">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
        </div>
        <h1>Liceo Nacional "Don Rómulo Gallegos"</h1>
        <h2>Selección de Rol de Usuario</h2>
        <div class="divider">
            <span>Selecciona tu rol</span>
        </div>
    </header>

    <main class="cards-container">
        <role-card role-type="Docente" name="Juan González" cedula="V-25.123.456" phone="+58 (414) 123-4567"
            email="juan.gonzalez@escuela.edu" years='["1er Año", "2do Año", "3er Año"]'
            subjects='["Matemática", "Física", "Geometría"]' students="">
            <svg slot="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
        </role-card>

        <role-card role-type="Representante" name="María Rodríguez" cedula="V-28.987.654" phone="+58 (424) 987-6543"
            email="maria.rodriguez@email.com" years='[]' subjects='[]' students="2">
            <svg slot="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="8.5" cy="7" r="4"></circle>
                <line x1="20" y1="8" x2="20" y2="14"></line>
                <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
        </role-card>
    </main>

    <footer class="footer-actions">
        <button id="btn-logout" class="btn-outline">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Cerrar sesión
        </button>
        <p class="copyright">Liceo Nacional "Don Rómulo Gallegos" • Derechos Reservados © 2026</p>
    </footer>

    <confirm-modal id="logout-modal"></confirm-modal>

    <script type="module" src="/src/scripts/config.js"></script>
    <script src="/src/components/RoleCard.component.js"></script>
    <script src="/src/components/ConfirmModal.component.js"></script>
    <script src="/src/components/loader.component.js"></script>
    <script src="/src/components/notification.component.js"></script>
    <script src="/src/components/notifications-container.component.js"></script>
    <script src="/src/scripts/roleselector.js"></script>
</body>

</html>
