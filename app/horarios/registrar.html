<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Horario | Liceo Nacional</title>
    <link rel="stylesheet" href="../../src/styles/schedulemanager.css" />

    <!-- Components -->
    <script src="../../src/components/notification.component.js" type="module"></script>
  </head>
  <body>
    <section class="notifications" id="notificationContainer"></section>
    <div class="top-bar">
      <a href="/app/dashboard/" id="exitBtn" class="exit-button">Salir</a>
    </div>

    <div class="main-content">
      <div class="header-area">
        <img
          src="../../src/assets/images/romulo.png"
          alt="Logo Liceo Nacional"
          class="logo"
        />
        <div class="title-group">
          <h1>Administración de Horarios</h1>
          <p>Edite las materias para cada sección y año.</p>
        </div>
      </div>

      <form id="controlsForm" class="controls-form">
        <div class="input-group">
          <label for="admin_year">Seleccionar Año:</label>
          <select id="admin_year" name="admin_year" required>
            <option value="">...</option>
          </select>
        </div>
        <div class="input-group">
          <label for="admin_section">Seleccionar Sección:</label>
          <select id="admin_section" name="admin_section" required>
            <option value="">...</option>
          </select>
        </div>

        <button type="submit" id="saveBtn" class="save-button">
          Guardar Horario
        </button>
      </form>

      <div id="scheduleEditor">
        <h2>Horario de Edición (Seleccione Año/Sección arriba)</h2>
        <table class="schedule-table" id="scheduleTable">
          <thead>
            <tr>
              <th style="width: 10%">Hora</th>
              <th style="width: 18%">Lunes</th>
              <th style="width: 18%">Martes</th>
              <th style="width: 18%">Miércoles</th>
              <th style="width: 18%">Jueves</th>
              <th style="width: 18%">Viernes</th>
            </tr>
          </thead>
          <tbody id="scheduleBody">
            <tr>
              <td>
                <input
                  type="text"
                  value="7:00 - 8:30"
                  class="schedule-input"
                  style="background-color: #f8f8f8"
                  disabled
                />
              </td>
              <td>
                <input
                  type="text"
                  placeholder="Materia / Profesor"
                  class="schedule-input"
                />
              </td>
              <td>
                <input
                  type="text"
                  placeholder="Materia / Profesor"
                  class="schedule-input"
                />
              </td>
              <td>
                <input
                  type="text"
                  placeholder="Materia / Profesor"
                  class="schedule-input"
                />
              </td>
              <td>
                <input
                  type="text"
                  placeholder="Materia / Profesor"
                  class="schedule-input"
                />
              </td>
              <td>
                <input
                  type="text"
                  placeholder="Materia / Profesor"
                  class="schedule-input"
                />
              </td>
            </tr>
            <tr>
              <td>
                <input
                  type="text"
                  value="8:35 - 10:05"
                  class="schedule-input"
                  style="background-color: #f8f8f8"
                  disabled
                />
              </td>
              <td>
                <input
                  type="text"
                  placeholder="Materia / Profesor"
                  class="schedule-input"
                />
              </td>
              <td>
                <input
                  type="text"
                  placeholder="Materia / Profesor"
                  class="schedule-input"
                />
              </td>
              <td>
                <input
                  type="text"
                  placeholder="Materia / Profesor"
                  class="schedule-input"
                />
              </td>
              <td>
                <input
                  type="text"
                  placeholder="Materia / Profesor"
                  class="schedule-input"
                />
              </td>
              <td>
                <input
                  type="text"
                  placeholder="Materia / Profesor"
                  class="schedule-input"
                />
              </td>
            </tr>
          </tbody>
        </table>
        </div>
      </div>
    </div>

    <script src="../../src/scripts/config.js" defer></script>
    <script src="../../src/scripts/schedulemanager.js" type="module" defer></script>
  </body>
</html>
