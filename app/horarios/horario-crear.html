<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Horarios - Crear</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* Estilos Generales */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #007bff;
            font-size: 2em;
            margin-bottom: 25px;
            text-align: center;
        }

        .section-title {
            color: #333;
            font-size: 1.5em;
            margin-top: 40px;
            margin-bottom: 15px;
        }

        /* --- Barra de Navegación (Header) --- */
        .navbar {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-title {
            font-weight: 700;
            font-size: 1.2em;
        }

        .btn-salir {
            background-color: #dc3545; /* Rojo */
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 700;
            display: flex;
            align-items: center;
            transition: background-color 0.2s;
        }

        .btn-salir:hover {
            background-color: #c82333;
        }

        .btn-salir svg {
            margin-right: 5px;
        }

        /* --- Formulario de Año/Sección/Aula --- */
        .year-section-form {
            display: flex;
            gap: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 4px;
            margin-bottom: 30px;
            flex-wrap: wrap; 
        }

        .year-section-form label {
            font-weight: 700;
            color: #007bff;
            margin-right: 5px;
            align-self: center; 
        }
        
        .form-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .year-section-form select {
            padding: 8px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            min-width: 100px; 
        }
        
        /* --- Tabla de Horarios --- */
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .schedule-table th {
            background-color: #007bff;
            color: white;
            padding: 10px;
            text-align: center;
            border: 1px solid #0056b3;
        }

        .schedule-table td {
            border: 1px solid #ccc;
            padding: 0;
            height: 40px;
            width: auto;
        }
        
        /* Estilo para la hora editable */
        .hour-input {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            border: none;
            padding: 8px;
            text-align: center;
            font-size: 0.9em;
            outline: none;
            background-color: #f9f9f9;
            font-weight: 500;
        }

        /* Estilo para los selectores de materia dentro de la tabla */
        .subject-select {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            border: none;
            padding: 5px 8px; 
            text-align: center;
            font-size: 0.9em;
            outline: none;
            cursor: pointer;
        }

        /* CORRECCIÓN: Oculta el botón "Agregar Fila" */
        #btn-add-row-schedule {
            display: none; 
        }

        /* --- Sección de Asignación de Profesores (AJUSTADO) --- */
        #assignment-list {
            margin-top: 20px;
            margin-bottom: 15px;
        }

        .assignment-row {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 10px;
            padding: 10px 0;
            border-bottom: 1px dashed #eee;
        }

        /* Estilo para la Materia (Fijo) */
        .assignment-row .materia-display {
            padding: 10px;
            background-color: #e9ecef;
            border-radius: 4px;
            font-weight: bold;
            min-width: 250px; 
            max-width: 250px; /* Ancho fijo para la materia */
            text-align: left;
        }
        
        /* AJUSTE CLAVE: Reducir el ancho del selector de profesor */
        .assignment-row select {
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 1em;
            /* Establecemos un ancho similar al de la materia */
            min-width: 250px;
            max-width: 300px; 
            flex-grow: 1; /* Permite crecer, pero limitado por max-width */
        }
        
        /* Ocultar el botón Agregar Profesor/Materia, ya que la lista es automática */
        #btn-add-assignment {
            display: none;
        }

        /* --- Pie de Página de Acciones --- */
        .actions-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 50px;
        }

        .btn-guardar {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 700;
            transition: background-color 0.2s;
        }

        .btn-guardar:hover {
            background-color: #0056b3;
        }

        .history-link-container {
            text-align: right;
        }

        .btn-ver-historial {
            background-color: #6c757d; 
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.2s;
        }

        .btn-ver-historial:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="navbar-left">
            <span class="app-title">Control de Horarios</span>
            </div>
        <div class="navbar-right">
            <a href="#" class="btn-salir">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-arrow-right" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/>
                    <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 1 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z"/>
                </svg>
                Salir
            </a>
        </div>
    </header>

    <main class="container">
        <h1>Crear Nuevo Horario Escolar</h1>

        <div class="year-section-form">
            <div class="form-group">
                <label for="select-year">Año:</label>
                <select id="select-year">
                    <option value="1er Año">1er Año</option>
                    <option value="2do Año">2do Año</option>
                    <option value="3er Año" selected>3er Año</option>
                    <option value="4to Año">4to Año</option>
                    <option value="5to Año">5to Año</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="select-section">Sección:</label>
                <select id="select-section">
                    <option value="A" selected>A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                    <option value="E">E</option>
                    <option value="Única">Única</option>
                </select>
            </div>

            <div class="form-group">
                <label for="select-aula">Aula:</label>
                <select id="select-aula">
                    </select>
            </div>
        </div>

        <div class="schedule-section">
            <table class="schedule-table">
                <thead>
                    <tr>
                        <th class="hour-column">Hora</th>
                        <th>Lunes</th>
                        <th>Martes</th>
                        <th>Miércoles</th>
                        <th>Jueves</th>
                        <th>Viernes</th>
                    </tr>
                </thead>
                <tbody id="schedule-body">
                    <tr data-block="1">
                        <td><input type="text" value="8:00 - 9:00" class="hour-input"></td>
                        <td><select class="subject-select" data-day="lunes" data-block="1" onchange="syncAssignments()"></select></td>
                        <td><select class="subject-select" data-day="martes" data-block="1" onchange="syncAssignments()"></select></td>
                        <td><select class="subject-select" data-day="miercoles" data-block="1" onchange="syncAssignments()"></select></td>
                        <td><select class="subject-select" data-day="jueves" data-block="1" onchange="syncAssignments()"></select></td>
                        <td><select class="subject-select" data-day="viernes" data-block="1" onchange="syncAssignments()"></select></td>
                    </tr>
                    <tr data-block="2">
                        <td><input type="text" value="9:00 - 10:00" class="hour-input"></td>
                        <td><select class="subject-select" data-day="lunes" data-block="2" onchange="syncAssignments()"></select></td>
                        <td><select class="subject-select" data-day="martes" data-block="2" onchange="syncAssignments()"></select></td>
                        <td><select class="subject-select" data-day="miercoles" data-block="2" onchange="syncAssignments()"></select></td>
                        <td><select class="subject-select" data-day="jueves" data-block="2" onchange="syncAssignments()"></select></td>
                        <td><select class="subject-select" data-day="viernes" data-block="2" onchange="syncAssignments()"></select></td>
                    </tr>
                    <tr data-block="3">
                        <td><input type="text" value="10:00 - 11:00" class="hour-input"></td>
                        <td><select class="subject-select" data-day="lunes" data-block="3" onchange="syncAssignments()"></select></td>
                        <td><select class="subject-select" data-day="martes" data-block="3" onchange="syncAssignments()"></select></td>
                        <td><select class="subject-select" data-day="miercoles" data-block="3" onchange="syncAssignments()"></select></td>
                        <td><select class="subject-select" data-day="jueves" data-block="3" onchange="syncAssignments()"></select></td>
                        <td><select class="subject-select" data-day="viernes" data-block="3" onchange="syncAssignments()"></select></td>
                    </tr>
                    <tr data-block="4">
                        <td><input type="text" value="11:00 - 12:00" class="hour-input"></td>
                        <td><select class="subject-select" data-day="lunes" data-block="4" onchange="syncAssignments()"></select></td>
                        <td><select class="subject-select" data-day="martes" data-block="4" onchange="syncAssignments()"></select></td>
                        <td><select class="subject-select" data-day="miercoles" data-block="4" onchange="syncAssignments()"></select></td>
                        <td><select class="subject-select" data-day="jueves" data-block="4" onchange="syncAssignments()"></select></td>
                        <td><select class="subject-select" data-day="viernes" data-block="4" onchange="syncAssignments()"></select></td>
                    </tr>
                </tbody>
            </table>
            </div>

        <h2 class="section-title">Asignación Profesores</h2>

        <div id="assignment-list">
        </div>

        <button class="btn-add-row" id="btn-add-assignment" style="display: none;" onclick="addAssignmentRow()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-circle-fill" viewBox="0 0 16 16">
                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3v3a.5.5 0 0 0 1 0v-3h3a.5.5 0 0 0 0-1h-3z"/>
            </svg>
            Agregar Profesor/Materia
        </button>


        <div class="actions-footer">
            <button class="btn-guardar" onclick="collectData()">Guardar Horario</button>
            <div class="history-link-container">
                <a href="horario-historial.html" class="btn-ver-historial">Ver Historial de Horarios</a>
                </div>
        </div>
        
    </main>

    <script>
        // --- DATA DE REFERENCIA (PROFESORES Y MATERIAS) ---
        
        // Lista de opciones de materia
        const materias = [
            { value: "", text: "Seleccionar Materia..." },
            { value: "castellano", text: "Castellano" },
            { value: "ingles", text: "Inglés" },
            { value: "matematicas", text: "Matemáticas" },
            { value: "quimica", text: "Química" },
            { value: "fisica", text: "Física" },
            { value: "arte", text: "Arte y Patrimonio" },
            { value: "biologia", text: "Biología" },
            { value: "edufisica", text: "Educación Física" },
            { value: "geohistoria", text: "Geografía e Historia" }
        ];

        // Opciones de profesor para la lista desplegable
        const profesorOptionsHTML = `
            <option value="">Seleccionar Profesor...</option>
            <option value="prof1">Profesor Juan Pérez</option>
            <option value="prof2">Profesora Ana Gómez</option>
            <option value="prof3">Profesor Carlos Silva</option>
            <option value="prof4">Profesora María Torres</option>
            <option value="prof5">Profesor Luis Blanco</option>
        `;
        
        // Almacenamiento temporal para guardar la asignación actual Profesor -> Materia
        let currentAssignments = {};

        // --- FUNCIONES AUXILIARES ---

        function generateMateriaOptions() {
            let optionsHTML = '';
            materias.forEach(materia => {
                optionsHTML += `<option value="${materia.value}">${materia.text}</option>`;
            });
            return optionsHTML;
        }
        const materiaOptionsHTML = generateMateriaOptions();

        function generateAulaOptions() {
            const aulaSelect = document.getElementById('select-aula');
            if (aulaSelect) {
                let optionsHTML = '<option value="">Seleccionar Aula...</option>';
                for (let i = 1; i <= 25; i++) {
                    optionsHTML += `<option value="${i}">Aula ${i}</option>`;
                }
                aulaSelect.innerHTML = optionsHTML;
                aulaSelect.value = 25;
            }
        }

        /**
         * Inicializa los SELECTs de la tabla de horarios con las materias
         */
        function initializeScheduleSelects() {
            const selects = document.querySelectorAll('.schedule-table .subject-select');
            selects.forEach(select => {
                select.innerHTML = materiaOptionsHTML;
            });
        }

        /**
         * FUNCION CLAVE: Obtiene las materias únicas seleccionadas en el horario 
         * y reconstruye la lista de asignación de profesores.
         */
        function syncAssignments() {
            const scheduleSelects = document.querySelectorAll('.subject-select');
            const assignmentList = document.getElementById('assignment-list');
            
            // 1. Obtener materias únicas (excluyendo la opción vacía)
            const uniqueSubjects = new Set();
            scheduleSelects.forEach(select => {
                if (select.value && select.value !== "") {
                    uniqueSubjects.add(select.value);
                }
            });

            // 2. Conservar las asignaciones actuales antes de limpiar
            const oldAssignments = {...currentAssignments};
            currentAssignments = {};

            // 3. Reconstruir la lista de Asignación Profesores
            assignmentList.innerHTML = '';

            uniqueSubjects.forEach(subjectValue => {
                // Obtener el nombre legible de la materia
                const subjectData = materias.find(m => m.value === subjectValue);
                const subjectName = subjectData ? subjectData.text : subjectValue;
                
                // Reutilizar la asignación previa si existe, o usar vacío
                const assignedProf = oldAssignments[subjectValue] || "";

                // Generar la fila de asignación
                const newAssignmentDiv = document.createElement('div');
                newAssignmentDiv.classList.add('assignment-row');
                newAssignmentDiv.setAttribute('data-subject', subjectValue);
                
                newAssignmentDiv.innerHTML = `
                    <div class="materia-display">${subjectName}</div>
                    <select class="form-control select-profesor" onchange="saveAssignment(this)">
                        ${profesorOptionsHTML}
                    </select>
                `;
                
                assignmentList.appendChild(newAssignmentDiv);
                
                // 4. Seleccionar el profesor guardado
                const profSelect = newAssignmentDiv.querySelector('.select-profesor');
                if (profSelect) {
                    profSelect.value = assignedProf;
                    // 5. Guardar la asignación actual
                    currentAssignments[subjectValue] = assignedProf; 
                }
            });
        }

        /**
         * Guarda la asignación de profesor en el objeto temporal `currentAssignments`.
         */
        function saveAssignment(selectElement) {
            const row = selectElement.closest('.assignment-row');
            const subjectValue = row.getAttribute('data-subject');
            const professorValue = selectElement.value;
            
            currentAssignments[subjectValue] = professorValue;
            console.log("Asignación guardada:", currentAssignments);
        }
        
        /**
         * Recolecta todos los datos del formulario (para simular el envío)
         */
        function collectData() {
            const horario = [];
            const scheduleRows = document.querySelectorAll('#schedule-body tr');
            
            // Recoger datos de la tabla de horario
            scheduleRows.forEach((row, blockIndex) => {
                const hourInput = row.querySelector('.hour-input');
                const rowData = {
                    block: blockIndex + 1,
                    hora: hourInput ? hourInput.value : `Bloque ${blockIndex + 1}`,
                    dias: {}
                };

                const selects = row.querySelectorAll('.subject-select');
                selects.forEach(select => {
                    const day = select.getAttribute('data-day');
                    if (select.value && select.value !== "") { // Solo guardar si hay materia seleccionada
                        rowData.dias[day] = select.value;
                    }
                });
                horario.push(rowData);
            });
            
            const formData = {
                year: document.getElementById('select-year').value,
                section: document.getElementById('select-section').value,
                aula: document.getElementById('select-aula').value,
                horario: horario,
                asignacion_profesores: currentAssignments
            };
            
            console.log("--- DATOS LISTOS PARA ENVÍO ---");
            console.log(JSON.stringify(formData, null, 2));
            alert('Datos recolectados. Mira la consola (F12) para ver el JSON listo para enviar.');

            return formData;
        }

        // --- INICIALIZACIÓN ---

        document.addEventListener('DOMContentLoaded', () => {
            generateAulaOptions();
            initializeScheduleSelects();
            syncAssignments(); 
        });
        
        // La función addRow() se elimina/comenta para asegurar que solo existan 4 bloques fijos.
        /*
        function addRow() {
             // ... código no accesible ...
        }
        */
    </script>
</body>
</html>
